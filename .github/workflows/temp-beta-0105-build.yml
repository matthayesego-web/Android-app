name: TEMP TornFCA v0.10.5 Beta Build

on:
  pull_request:
    branches: [ restore/v0.10.1-source-hardened-2026-08-17 ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify Beta test fallback and version
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.5"' app/build.gradle.kts
          grep -q 'versionCode = 60' app/build.gradle.kts
          grep -q 'localBetaFallbackAvailable' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperGateActivity.java
          grep -q 'BuildConfig.DEVELOPER_PLAYER_ID' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperGateActivity.java
          grep -q 'local-beta-owner:' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperPanelActivity.java
      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta
      - uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.5-unsigned
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 2
