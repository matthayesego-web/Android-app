name: TEMP TornFCA v0.10.12 Compile

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify optimization markers
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.12"' app/build.gradle.kts
          grep -q 'versionCode = 67' app/build.gradle.kts
          grep -q 'class DataFreshness' app/src/main/java/com/matthayesego/duckforcetoolkit/DataFreshness.java
          grep -q 'putChat' app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmCache.java
          grep -q 'FactionMemberCache.save' app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmup.java
          grep -q 'WAR_CACHE_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q 'Executors.newFixedThreadPool' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberFactionActivity.java
          grep -q 'DataFreshness.label' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDirectoryActivity.java
          grep -q 'onPause' app/src/main/java/com/matthayesego/duckforcetoolkit/WarNoticeActivity.java
          grep -q 'WAR_CACHE_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          grep -q 'CHAT_CACHE_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionChatActivity.java
          grep -q 'openRelated' app/src/main/java/com/matthayesego/duckforcetoolkit/NotificationInboxActivity.java
          grep -q 'root.post' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          grep -q 'android:scaleX="1.14"' app/src/main/res/drawable/tornfca_launcher_mark.xml
      - name: Syntax check backends
        run: |
          set -euo pipefail
          for file in backend/AccessBackend.gs backend/TornFcaCommunityBackend.gs backend/TornFcaPremiumBackend.gs backend/TornFcaDeveloperBackend.gs backend/TornFcaWarPayBackend.gs backend/TornFcaFeedbackBackend.gs; do
            cp "$file" "/tmp/$(basename "$file").js"
            node --check "/tmp/$(basename "$file").js"
          done
      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta
      - name: Upload unsigned Beta
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.12-unsigned-optimization
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish connector-readable compile status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/v01012-status"
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init
          git checkout --orphan v01012-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/beta/app-beta-unsigned.apk" ]; then
            RESULT=success
            SHA="$(sha256sum "$GITHUB_WORKSPACE/app/build/outputs/apk/beta/app-beta-unsigned.apk" | awk '{print $1}')"
          else
            RESULT=failure
            SHA=unavailable
          fi
          printf 'version=0.10.12\nversion_code=67\nrun_id=%s\nsource_commit=%s\ncompile=%s\nunsigned_sha256=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RESULT" "$SHA" > status.txt
          git add status.txt
          git commit -m "Publish v0.10.12 compile status"
          git push --force origin HEAD:v01012-status
