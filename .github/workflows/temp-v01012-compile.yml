name: TEMP TornFCA v0.10.12 Compile

on:
  push:
    branches: [ work/v0.10.12-stability-polish ]
  pull_request:
    branches: [ restore/v0.10.1-source-hardened-2026-08-17 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify stability markers
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.12"' app/build.gradle.kts
          grep -q 'versionCode = 67' app/build.gradle.kts
          grep -q 'class DataFreshness' app/src/main/java/com/matthayesego/duckforcetoolkit/DataFreshness.java
          grep -q 'putChat' app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmCache.java
          grep -q 'onPause' app/src/main/java/com/matthayesego/duckforcetoolkit/WarNoticeActivity.java
          grep -q 'WAR_CACHE_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          grep -q 'CHAT_CACHE_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionChatActivity.java
      - name: Syntax check backends
        run: |
          set -euo pipefail
          for file in backend/AccessBackend.gs backend/TornFcaCommunityBackend.gs backend/TornFcaPremiumBackend.gs backend/TornFcaDeveloperBackend.gs backend/TornFcaWarPayBackend.gs backend/TornFcaFeedbackBackend.gs; do
            cp "$file" "/tmp/$(basename "$file").js"
            node --check "/tmp/$(basename "$file").js"
          done
      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta
