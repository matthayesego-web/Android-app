name: TEMP TornFCA v0.10.16 Push Dedupe Compiler

on:
  pull_request:
    branches: [ v0.9-faction-automation ]

permissions:
  contents: read

jobs:
  build-v01016:
    runs-on: ubuntu-latest
    env:
      TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
      TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
      TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
      TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout isolated source
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.16-push-dedupe-banking

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate Firebase and dedupe source
        run: |
          set -euo pipefail
          test -n "$TORNFCA_FIREBASE_APP_ID"
          test -n "$TORNFCA_FIREBASE_API_KEY"
          test -n "$TORNFCA_FIREBASE_PROJECT_ID"
          test -n "$TORNFCA_FIREBASE_SENDER_ID"
          grep -q 'versionName = "0.10.16"' app/build.gradle.kts
          grep -q 'versionCode = 71' app/build.gradle.kts
          grep -q 'DEDUPE_WINDOW_MS=5000L' app/src/main/java/com/matthayesego/duckforcetoolkit/NotificationCenter.java
          grep -q 'publishAnnouncement(key,titleValue,messageValue)' app/src/main/java/com/matthayesego/duckforcetoolkit/WarNoticeActivity.java
          grep -q 'publishBankingRequest(key,summary,noteValue)' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingCompanionActivity.java

      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta

      - name: Upload unsigned candidate
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.16-Push-Dedupe-Banking-unsigned
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7
