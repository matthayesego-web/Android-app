name: TornFCA Fix Command Navigation Reset

on:
  push:
    branches: [ work/v0.10.18-beta-hardening ]
    paths:
      - '.github/workflows/tornfca-fix-command-navigation-reset.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
      TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
      TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
      TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout beta branch
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening
          fetch-depth: 0

      - name: Record patch run ID
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01018-navigation-patch-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/v01018-navigation-patch-run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record navigation patch run'
            git push origin HEAD:work/v0.10.18-beta-hardening
          fi

      - name: Apply command-shell stability patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java')
          text = path.read_text()

          replacements = [
              (
                  '    private Identity identity;\n',
                  '    private Identity identity;\n    private String currentSection="Home";\n'
              ),
              (
                  '    @Override public void setContentView(View view){super.setContentView(view);ViewGroup root=findViewById(android.R.id.content);if(root==null)return;forceCurrentVersion(root);if(isLegacyAuthenticatedHome(root))installCommandShell(root);}\n'
                  '    @Override protected void onResume(){super.onResume();ViewGroup root=findViewById(android.R.id.content);if(root==null)return;forceCurrentVersion(root);if(isLegacyAuthenticatedHome(root))installCommandShell(root);else if(isCommandShell(root)){Identity now=resolveIdentity();if(identity==null||!identity.sameAs(now))installCommandShell(root);else applyCachedAvatar(root);}}\n',
                  '    @Override public void setContentView(View view){ViewGroup active=findViewById(android.R.id.content);if(active!=null&&isCommandShell(active)&&isLegacyAuthenticatedHome(view)){Identity now=resolveIdentity();if(isResolvedIdentity(now))identity=now;return;}super.setContentView(view);ViewGroup root=findViewById(android.R.id.content);if(root==null)return;forceCurrentVersion(root);if(isLegacyAuthenticatedHome(root))installCommandShell(root);}\n'
                  '    @Override protected void onResume(){super.onResume();ViewGroup root=findViewById(android.R.id.content);if(root==null)return;forceCurrentVersion(root);if(isLegacyAuthenticatedHome(root))installCommandShell(root);else if(isCommandShell(root)){Identity now=resolveIdentity();if(!isResolvedIdentity(now)&&isResolvedIdentity(identity)){applyCachedAvatar(root);return;}if(identity==null||!identity.sameAs(now))installCommandShell(root);else applyCachedAvatar(root);}}\n'
              ),
              (
                  '    private boolean isLegacyAuthenticatedHome(View root){if(root==null)return false;if(root instanceof ViewGroup&&isCommandShell((ViewGroup)root))return false;return containsText(root,"Welcome back,")&&containsText(root,"War");}\n',
                  '    private boolean isLegacyAuthenticatedHome(View root){if(root==null)return false;if(root instanceof ViewGroup&&isCommandShell((ViewGroup)root))return false;return containsText(root,"Welcome back,")&&containsText(root,"War");}\n'
                  '    private boolean isResolvedIdentity(Identity value){return value!=null&&value.playerId>0;}\n'
              ),
              (
                  '    private void installCommandShell(ViewGroup host){\n        identity=resolveIdentity();host.removeAllViews();getWindow().setStatusBarColor(TornFcaCommandUi.BG);getWindow().setNavigationBarColor(TornFcaCommandUi.BG);\n',
                  '    private void installCommandShell(ViewGroup host){\n        String requested=pageHost!=null?currentSection:(getIntent()==null?null:getIntent().getStringExtra(EXTRA_SECTION));Identity resolved=resolveIdentity();if(isResolvedIdentity(resolved)||identity==null)identity=resolved;host.removeAllViews();getWindow().setStatusBarColor(TornFcaCommandUi.BG);getWindow().setNavigationBarColor(TornFcaCommandUi.BG);\n'
              ),
              (
                  '        String requested=getIntent()==null?null:getIntent().getStringExtra(EXTRA_SECTION);renderRequested(requested);host.post(()->applyCachedAvatar(host));\n',
                  '        renderRequested(requested);host.post(()->applyCachedAvatar(host));\n'
              ),
              (
                  '    private void beginPage(String section,String title,String subtitle,int accent){pageHost.removeAllViews();selectNav(section);LinearLayout heading=TornFcaCommandUi.sectionHeading(this,title,subtitle,accent);LinearLayout.LayoutParams hp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT);hp.bottomMargin=TornFcaCommandUi.dp(this,16);pageHost.addView(heading,hp);}\n',
                  '    private void beginPage(String section,String title,String subtitle,int accent){currentSection=section;Intent intent=getIntent();if(intent!=null)intent.putExtra(EXTRA_SECTION,section);pageHost.removeAllViews();selectNav(section);LinearLayout heading=TornFcaCommandUi.sectionHeading(this,title,subtitle,accent);LinearLayout.LayoutParams hp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.WRAP_CONTENT);hp.bottomMargin=TornFcaCommandUi.dp(this,16);pageHost.addView(heading,hp);}\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one source match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          required = [
              'active!=null&&isCommandShell(active)&&isLegacyAuthenticatedHome(view)',
              'private boolean isResolvedIdentity(Identity value)',
              'String requested=pageHost!=null?currentSection',
              'currentSection=section;Intent intent=getIntent()',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'Missing patched marker: {marker}')

          path.write_text(text)

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile patched beta
        run: gradle --no-daemon :app:compileBetaJavaWithJavac

      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Fix command screen reset to Home'
          git fetch origin work/v0.10.18-beta-hardening
          git rebase origin/work/v0.10.18-beta-hardening
          git push origin HEAD:work/v0.10.18-beta-hardening
