name: TornFCA v0.10.19 Final Runtime Audit

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/v01019-final-runtime-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Record exact runtime audit run
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01019-final-runtime-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/v01019-final-runtime-run.txt
          git commit -m 'Record v0.10.19 final runtime audit run' || true
          git pull --rebase origin develop
          git push origin HEAD:develop

      - name: Verify candidate identity and live backends
        run: |
          set -euo pipefail
          grep -q 'versionCode = 74' app/build.gradle.kts
          grep -q 'versionName = "0.10.19"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'androidx.activity:activity:1.10.1' app/build.gradle.kts
          ! grep -R 'void onBackPressed' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java app/src/main/java/com/matthayesego/duckforcetoolkit/PlayReviewActivity.java app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java
          curl -fLsS --retry 3 --retry-delay 2 'https://script.google.com/macros/s/AKfycbwphLmR-N82GJUChzwZlxQ8DGKVoaN6VCNiXvbpKfgJV6JUxlcwPOYVKgbI1h9tmjp-ig/exec' -o /tmp/community.json
          curl -fLsS --retry 3 --retry-delay 2 'https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec' -o /tmp/premium.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/community.json')); p=json.load(open('/tmp/premium.json'))
          assert c.get('ok') is True and c.get('version') == '1.9.0', c
          assert p.get('ok') is True and p.get('version') == '1.3.1', p
          assert p.get('monetization_approved') is False, p
          print('Community',c.get('version'),'Premium',p.get('version'),'monetization',p.get('monetization_approved'))
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Fresh Lint, tests and builds
        env:
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:lintBeta :app:testDebugUnitTest :app:assembleDebug :app:assembleBeta

      - name: Add transient screen-audit instrumentation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts'); t=p.read_text()
          marker='        versionName = "0.10.19"\n'
          addition='        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"\n'
          if addition not in t:
              if marker not in t: raise SystemExit('version marker missing')
              t=t.replace(marker,marker+addition,1)
          deps='''    androidTestImplementation("androidx.test:runner:1.6.2")\n    androidTestImplementation("androidx.test:rules:1.6.1")\n    androidTestImplementation("androidx.test.ext:junit:1.2.1")\n'''
          if 'androidTestImplementation("androidx.test:runner:1.6.2")' not in t:
              t=t.replace('dependencies {\n','dependencies {\n'+deps,1)
          p.write_text(t)
          PY
          mkdir -p app/src/androidTest/java/com/matthayesego/duckforcetoolkit
          cat > app/src/androidTest/java/com/matthayesego/duckforcetoolkit/PreBetaScreenAuditTest.java <<'JAVA'
          package com.matthayesego.duckforcetoolkit;

          import static org.junit.Assert.assertNotNull;

          import android.app.Activity;
          import android.app.Instrumentation;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.os.SystemClock;
          import android.util.Log;

          import androidx.test.ext.junit.runners.AndroidJUnit4;
          import androidx.test.platform.app.InstrumentationRegistry;
          import androidx.test.runner.lifecycle.ActivityLifecycleMonitorRegistry;
          import androidx.test.runner.lifecycle.Stage;

          import org.junit.After;
          import org.junit.Before;
          import org.junit.Test;
          import org.junit.runner.RunWith;

          import java.io.File;
          import java.io.FileOutputStream;
          import java.util.ArrayList;
          import java.util.Collection;

          @RunWith(AndroidJUnit4.class)
          public class PreBetaScreenAuditTest {
              private static final String TAG="TORNFCA_AUDIT";
              private Instrumentation inst;
              private Context app;
              private File shots;

              @Before public void setup(){
                  inst=InstrumentationRegistry.getInstrumentation();
                  app=inst.getTargetContext();
                  shots=new File(app.getFilesDir(),"screen-audit");
                  shots.mkdirs();
                  PlayReviewStore.clear(app);
              }

              @After public void cleanup(){finishAll();PlayReviewStore.clear(app);}

              private Intent intent(Class<? extends Activity> cls){
                  Intent i=new Intent(app,cls);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  i.putExtra(FactionOpsActivity.EXTRA_FACTION_ID,990001);
                  i.putExtra(FactionOpsActivity.EXTRA_FACTION_NAME,"Harbor Ducks");
                  i.putExtra(FactionOpsActivity.EXTRA_FACTION_API,true);
                  i.putExtra(DeveloperConsoleActivity.EXTRA_POSITION,"Leader");
                  i.putExtra(WarNoticeActivity.EXTRA_CAN_PUBLISH,true);
                  return i;
              }

              private void audit(String name,Intent i)throws Exception{
                  Log.i(TAG,"OPEN "+name+" -> "+i.getComponent());
                  Activity started=inst.startActivitySync(i);
                  inst.waitForIdleSync();
                  SystemClock.sleep(700);
                  assertNotNull("Activity did not start: "+name,started);
                  capture(name);
                  Log.i(TAG,"PASS "+name+" activity="+started.getClass().getSimpleName()+" finishing="+started.isFinishing());
                  finishAll();
                  inst.waitForIdleSync();
                  SystemClock.sleep(150);
              }

              private void capture(String name)throws Exception{
                  Bitmap b=inst.getUiAutomation().takeScreenshot();
                  if(b==null)return;
                  String safe=name.replaceAll("[^A-Za-z0-9._-]+","_");
                  try(FileOutputStream out=new FileOutputStream(new File(shots,safe+".png"))){b.compress(Bitmap.CompressFormat.PNG,100,out);}
                  b.recycle();
              }

              private void finishAll(){
                  inst.runOnMainSync(()->{
                      Collection<Activity> active=ActivityLifecycleMonitorRegistry.getInstance().getActivitiesInStage(Stage.RESUMED);
                      for(Activity a:new ArrayList<>(active)) if(a!=null&&!a.isFinishing()) a.finish();
                  });
              }

              @Test public void screenByScreenRuntimeAudit()throws Exception{
                  audit("01_Access_Gate",intent(AccessGateActivity.class));
                  audit("02_Command_Shell_Login_State",intent(BetaCommandActivity.class));
                  audit("03_Settings",intent(SettingsActivity.class));
                  audit("04_Legal_Privacy",intent(LegalActivity.class));
                  audit("05_Notification_Settings",intent(NotificationSettingsActivity.class));
                  audit("06_Notification_Inbox",intent(NotificationInboxActivity.class));
                  audit("07_More",intent(MoreActivity.class));
                  audit("08_About",intent(AboutActivity.class));
                  audit("09_Member_Center",intent(MemberCenterActivity.class));
                  audit("10_Member_Directory",intent(MemberDirectoryActivity.class));
                  audit("11_Faction_Resources",intent(FactionResourcesActivity.class));
                  audit("12_Training_Center",intent(TrainingCenterActivity.class));
                  audit("13_Training_Progress",intent(TrainingProgressActivity.class));
                  audit("14_War_Prep",intent(WarPrepActivity.class));
                  audit("15_War_Hub",intent(WarHubActivity.class));
                  audit("16_Territory_War",intent(TerritoryWarActivity.class));
                  audit("17_Premium_Insights",intent(PremiumInsightsActivity.class));
                  audit("18_Premium_Trends",intent(PremiumActivityTrendsActivity.class));
                  audit("19_Faction_Chat",intent(FactionChatActivity.class));
                  audit("20_Feedback",intent(FeedbackActivity.class));
                  audit("21_Banking",intent(BankingCompanionActivity.class));
                  audit("22_Announcements",intent(WarNoticeActivity.class));
                  Intent activity=intent(FactionOpsActivity.class);activity.putExtra(FactionOpsActivity.EXTRA_MODE,FactionOpsActivity.MODE_ACTIVITY);audit("23_Faction_Activity",activity);
                  Intent war=intent(FactionOpsActivity.class);war.putExtra(FactionOpsActivity.EXTRA_MODE,FactionOpsActivity.MODE_WAR);audit("24_War_Participation",war);
                  Intent chain=intent(FactionOpsActivity.class);chain.putExtra(FactionOpsActivity.EXTRA_MODE,FactionOpsActivity.MODE_CHAIN);audit("25_Chain_Command",chain);
                  Intent oc=intent(FactionOpsActivity.class);oc.putExtra(FactionOpsActivity.EXTRA_MODE,FactionOpsActivity.MODE_OC);audit("26_OC_Readiness",oc);
                  audit("27_OC_Tracker",intent(OcTrackerActivity.class));
                  audit("28_Quick_Intel",intent(QuickIntelActivity.class));
                  audit("29_Premium_Status",intent(PremiumPreviewActivity.class));
                  audit("30_Leadership_Attention",intent(LeadershipAttentionActivity.class));
                  audit("31_Faction_Strength",intent(FactionStrengthActivity.class));
                  audit("32_Developer_Console",intent(DeveloperConsoleActivity.class));
                  audit("33_Developer_Gate",intent(DeveloperGateActivity.class));
                  Intent tool=intent(ToolHostActivity.class);tool.putExtra(ToolHostActivity.EXTRA_TOOL,"ARMORY");audit("34_Embedded_Armory",tool);
                  PlayReviewStore.enter(app,PlayReviewStore.Persona.LEADER);
                  audit("35_Play_Review_Leader_Dashboard",intent(PlayReviewActivity.class));
                  PlayReviewStore.clear(app);
              }
          }
          JAVA

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Android 16 screen-by-screen runtime audit
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb logcat -c
            adb shell getprop ro.build.version.sdk | tee /tmp/android-sdk.txt
            test "$(tr -d '\r' </tmp/android-sdk.txt)" = "36"
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p audit-output
            adb logcat -d > audit-output/logcat.txt
            adb exec-out run-as com.matthayesego.duckforcetoolkit.internal tar -cf - -C files screen-audit > audit-output/screen-audit.tar 2>/dev/null || true
            grep 'TORNFCA_AUDIT' audit-output/logcat.txt > audit-output/screen-results.txt || true
            test "$(grep -c 'TORNFCA_AUDIT.*PASS' audit-output/screen-results.txt || true)" -ge 35
            if grep -n -E 'FATAL EXCEPTION|ANR in com\.matthayesego\.duckforcetoolkit\.internal|Process: com\.matthayesego\.duckforcetoolkit\.internal' audit-output/logcat.txt; then
              echo 'Fatal TornFCA runtime evidence found.'
              exit 1
            fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v0.10.19-final-runtime-audit
          path: |
            audit-output/
            app/build/reports/androidTests/connected/
            app/build/reports/lint-results-beta.html
          if-no-files-found: warn
          retention-days: 14
