name: v0.9 Faction Automation Build

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read and verify beta metadata
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          case "$VERSION_NAME" in 0.9.*) ;; *) echo "v0.9 branch must stay in 0.9.x"; exit 1;; esac
          grep -q 'AccessGateActivity' app/src/main/AndroidManifest.xml
          grep -q 'V095CompanionActivity' app/src/main/AndroidManifest.xml
          grep -q 'DeveloperGateActivity' app/src/main/AndroidManifest.xml
          grep -q 'V095CompanionActivity.class' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q "v${VERSION_NAME}" app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q "v${VERSION_NAME}" app/src/main/java/com/matthayesego/duckforcetoolkit/V095CompanionActivity.java
          if grep -q 'android:name=".V090CompanionActivity"' app/src/main/AndroidManifest.xml; then echo "Legacy V090 shell must not be restorable"; exit 1; fi
          if grep -q 'android:name=".PolishedCompanionActivity"' app/src/main/AndroidManifest.xml; then echo "Legacy v0.8 shell must not be restorable"; exit 1; fi
          if grep -q 'android:name=".CompanionActivity"' app/src/main/AndroidManifest.xml; then echo "Legacy base shell must not be restorable"; exit 1; fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned beta and release
        run: gradle --no-daemon :app:assembleBeta :app:assembleRelease

      - name: Align APKs and package signing tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" -P 16 -f -v 4 app/build/outputs/apk/beta/app-beta-unsigned.apk "DuckForce-Companion-v${VERSION_NAME}-internal-beta-aligned-unsigned.apk"
          "$ZIPALIGN" -P 16 -f -v 4 app/build/outputs/apk/release/app-release-unsigned.apk "DuckForce-Companion-v${VERSION_NAME}-aligned-unsigned-release.apk"
          "$ZIPALIGN" -c -P 16 -v 4 "DuckForce-Companion-v${VERSION_NAME}-internal-beta-aligned-unsigned.apk"
          "$ZIPALIGN" -c -P 16 -v 4 "DuckForce-Companion-v${VERSION_NAME}-aligned-unsigned-release.apk"

          mkdir -p android-signing-tool/lib
          cp "$APKSIGNER" android-signing-tool/apksigner
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" android-signing-tool/lib/apksigner.jar
          cp "$ZIPALIGN" android-signing-tool/zipalign
          chmod +x android-signing-tool/apksigner android-signing-tool/zipalign

      - name: Upload v0.9 APKs
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Companion-v${{ env.VERSION_NAME }}-branch-builds
          path: |
            DuckForce-Companion-v${{ env.VERSION_NAME }}-internal-beta-aligned-unsigned.apk
            DuckForce-Companion-v${{ env.VERSION_NAME }}-aligned-unsigned-release.apk
            android-signing-tool/apksigner
            android-signing-tool/lib/apksigner.jar
            android-signing-tool/zipalign
          if-no-files-found: error
          retention-days: 14
