name: TornFCA v0.9 Build

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read and verify TornFCA beta metadata
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          case "$VERSION_NAME" in 0.9.*) ;; *) echo "TornFCA beta branch must stay in 0.9.x"; exit 1;; esac
          grep -q 'manifestPlaceholders\["appLabel"\] = "TornFCA"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'TornFcaActivity' app/src/main/AndroidManifest.xml
          grep -q 'TornFcaScreens' app/src/main/AndroidManifest.xml
          grep -q 'BankingCompanionActivity' app/src/main/AndroidManifest.xml
          grep -q 'MemberDossierActivity' app/src/main/AndroidManifest.xml
          grep -q 'PremiumAdminActivity' app/src/main/AndroidManifest.xml
          test "$(grep -c 'android:exported="true"' app/src/main/AndroidManifest.xml)" -eq 1
          grep -q 'AccessGateActivity" android:exported="true"' app/src/main/AndroidManifest.xml
          grep -q 'TornFcaActivity.class' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q "v${VERSION_NAME}" app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q 'VERSION=BuildConfig.VERSION_NAME' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'replace("-internal","").replace("-beta","")' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'class V095CompanionActivity' app/src/main/java/com/matthayesego/duckforcetoolkit/V095CompanionActivity.java
          grep -q 'BuildConfig.DEVELOPER_ACCESS_SHA256' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperGateActivity.java
          grep -q 'DEVELOPER_PLAYER_ID' app/build.gradle.kts
          grep -q 'BuildConfig.DEVELOPER_PLAYER_ID' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperGateActivity.java
          grep -q 'BuildConfig.FACTION_BACKEND_URL' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionBackendClient.java
          grep -q 'BuildConfig.PREMIUM_BACKEND_URL' app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumBackendClient.java

          # One-key / Torn rate-safety and latency gates.
          grep -q 'Limited Access Torn API key' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          grep -q 'TOKEN_REFILL_MS = 2000L' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'TOKEN_CAPACITY = 3.0' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'FutureTask<JSONObject>' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'selections=profile,faction' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'cachedSession' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'AVATAR_REFRESH_MS' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          grep -q 'profile_image' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          grep -q 'PermanentApiException' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'TornApiClient.validateKey' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionBackendClient.java
          grep -q '10000L' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionBackendClient.java

          # Cache identity must use collision-resistant fingerprints, never raw 32-bit key hashes.
          grep -q 'keyFingerprint' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'MessageDigest.getInstance("SHA-256")' app/src/main/java/com/matthayesego/duckforcetoolkit/TornApiClient.java
          grep -q 'String cacheKey=fingerprint(value)' app/src/main/java/com/matthayesego/duckforcetoolkit/TornStatsClient.java
          grep -q 'fingerprint(targets.toString())' app/src/main/java/com/matthayesego/duckforcetoolkit/FFScouterClient.java

          # API-key retention / logout must remain explicit and device-local.
          grep -q 'AES/GCM/NoPadding' app/src/main/java/com/matthayesego/duckforcetoolkit/SecureApiKeyStore.java
          grep -q 'EXPIRES_AT' app/src/main/java/com/matthayesego/duckforcetoolkit/SecureApiKeyStore.java
          grep -q 'prepareNextSave' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          grep -q 'Log Out / Change API Key' app/src/main/java/com/matthayesego/duckforcetoolkit/MoreActivity.java
          grep -q 'TornApiClient.clearMemoryCache' app/src/main/java/com/matthayesego/duckforcetoolkit/MoreActivity.java
          grep -q 'FactionMemberCache.clear()' app/src/main/java/com/matthayesego/duckforcetoolkit/MoreActivity.java

          # Multi-faction tenant identity must not regress to a Duck Force-only membership gate.
          if grep -q 'restricted to Duck Force members' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberFactionActivity.java; then echo "Member faction views must remain multi-faction"; exit 1; fi
          if grep -q 'restricted to Duck Force members' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java; then echo "Base authentication must remain multi-faction"; exit 1; fi
          if grep -q 'DUCK_FORCE_NAME' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java; then echo "Base authentication must not reintroduce a faction-name allowlist"; exit 1; fi
          grep -q 'APP_VERSION = TornFcaBrand.VERSION' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java
          grep -q 'TornFcaBrand.VERSION' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberFactionActivity.java
          grep -q 'repairFactionIdentity' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java

          # Local banking fallback must remain scoped to both user and faction tenant.
          grep -q 'row.put("factionId", session.factionId)' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingDraftStore.java
          grep -q 'rowFaction!=current.factionId' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingDraftStore.java
          grep -q 'legacy/unscoped rows never auto-sync' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingDraftStore.java

          # Member features remain self/public-faction scoped and tolerate Torn field changes.
          grep -q 'loadSelfSnapshot' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q '/user/money' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q 'optJSONObject("faction")' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q '/user/perks' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q 'Faction Perks' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q 'My Faction Standing' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q '/members' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDailyActivity.java
          grep -q '/user/organizedcrime' app/src/main/java/com/matthayesego/duckforcetoolkit/OcTrackerActivity.java

          # Leadership and war-wall gates must remain layered.
          grep -q 'AccessPolicy.isLeaderPosition(position)' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPayoutActivity.java
          grep -q 'DeveloperPreviewStore.isMemberPreview' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'requiresLeadership(target)' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'TARGET_ACTIVITY.equals(target)' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'TARGET_PULSE.equals(target)' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'TARGET_LOOKUP.equals(target)' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'TARGET_WAR_PAYOUT.equals(target)' app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          grep -q 'loadFaction(key)' app/src/main/java/com/matthayesego/duckforcetoolkit/OcTrackerActivity.java
          grep -q 'simulateWar' app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperSettings.java
          grep -q 'War wall simulation' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaScreens.java
          grep -q 'isUpcoming' app/src/main/java/com/matthayesego/duckforcetoolkit/WarCenterActivity.java
          grep -q 'isLive' app/src/main/java/com/matthayesego/duckforcetoolkit/WarCenterActivity.java

          # Leadership shell must always expose the operational tools independently of legacy cards.
          grep -q 'Activity Tracker' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'FeatureRouterActivity.TARGET_ACTIVITY' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'Faction Pulse' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'FeatureRouterActivity.TARGET_PULSE' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'Armory Auditor' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q 'ToolHostActivity.EXTRA_TOOL' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java
          grep -q '"ARMORY"' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaBrand.java

          # Embedded tools must share the native throttle and never receive the actual key in JS.
          grep -q 'TornApiClient.getJsonAbsolute' app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java
          grep -q 'MANAGED_KEY_SENTINEL' app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java
          if grep -q 'JSONObject.quote(key)' app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java; then echo "Real Torn key must never be injected into embedded JavaScript"; exit 1; fi

          # Provider consent/rate gates.
          grep -q 'requireAuthorizedKey' app/src/main/java/com/matthayesego/duckforcetoolkit/FFScouterClient.java
          grep -q 'renderProviderConsent' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionStrengthActivity.java
          grep -q 'FFScouterClient.hasConsent' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDossierActivity.java
          grep -q 'TornStatsClient.hasConsent' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDossierActivity.java
          grep -q 'Open TornStats Terms' app/src/main/java/com/matthayesego/duckforcetoolkit/MemberDossierActivity.java
          grep -q 'approvedFingerprint' app/src/main/java/com/matthayesego/duckforcetoolkit/TornStatsClient.java
          grep -q '5000L' app/src/main/java/com/matthayesego/duckforcetoolkit/TornStatsClient.java

          # Banking listener is interaction-scoped and does not use Torn API.
          grep -q 'ACTIVE_WINDOW_MS' app/src/main/assets/listener/duckforce_chat_listener.user.js
          grep -q 'FACTION_CHAT_ACTIVE' app/src/main/assets/listener/duckforce_chat_listener.user.js
          grep -q 'TORNFCA_XANAX_ITEM_ID=206' backend/TornFcaPremiumBackend.gs
          grep -q 'tornfca_mark' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          if grep -q 'PREVIEW_ACCESS_SHA256' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java; then echo "Legacy beta access-code gate must be removed"; exit 1; fi
          if grep -q 'android:allowBackup="true"' app/src/main/AndroidManifest.xml; then echo "API-key application backup must remain disabled"; exit 1; fi
          for legacy in V090CompanionActivity PolishedCompanionActivity CompanionActivity V095CompanionActivity V098CompanionActivity MainActivity ToolkitActivity; do
            if grep -q "android:name=\".${legacy}\"" app/src/main/AndroidManifest.xml; then echo "Legacy/bypass activity ${legacy} must not be launchable"; exit 1; fi
          done
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned beta and release
        env:
          TORNFCA_DEV_PASSWORD_SHA256: ${{ secrets.TORNFCA_DEV_PASSWORD_SHA256 }}
          TORNFCA_FACTION_BACKEND_URL: ${{ secrets.TORNFCA_FACTION_BACKEND_URL }}
          TORNFCA_PREMIUM_BACKEND_URL: ${{ secrets.TORNFCA_PREMIUM_BACKEND_URL }}
        run: gradle --no-daemon :app:assembleBeta :app:assembleRelease

      - name: Align APKs and package signing tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ZIPALIGN="$(find "$SDK_ROOT/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"

          "$ZIPALIGN" -P 16 -f -v 4 app/build/outputs/apk/beta/app-beta-unsigned.apk "TornFCA-v${VERSION_NAME}-internal-beta-aligned-unsigned.apk"
          "$ZIPALIGN" -P 16 -f -v 4 app/build/outputs/apk/release/app-release-unsigned.apk "TornFCA-v${VERSION_NAME}-aligned-unsigned-release.apk"
          "$ZIPALIGN" -c -P 16 -v 4 "TornFCA-v${VERSION_NAME}-internal-beta-aligned-unsigned.apk"
          "$ZIPALIGN" -c -P 16 -v 4 "TornFCA-v${VERSION_NAME}-aligned-unsigned-release.apk"

          mkdir -p android-signing-tool/lib
          cp "$APKSIGNER" android-signing-tool/apksigner
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" android-signing-tool/lib/apksigner.jar
          cp "$ZIPALIGN" android-signing-tool/zipalign
          chmod +x android-signing-tool/apksigner android-signing-tool/zipalign

      - name: Upload TornFCA v0.9 APKs
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v${{ env.VERSION_NAME }}-branch-builds
          path: |
            TornFCA-v${{ env.VERSION_NAME }}-internal-beta-aligned-unsigned.apk
            TornFCA-v${{ env.VERSION_NAME }}-aligned-unsigned-release.apk
            android-signing-tool/apksigner
            android-signing-tool/lib/apksigner.jar
            android-signing-tool/zipalign
          if-no-files-found: error
          retention-days: 14
