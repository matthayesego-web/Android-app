name: v0.9 Faction Automation Build

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify v0.9 metadata
        run: |
          grep -q 'versionCode = 15' app/build.gradle.kts
          grep -q 'versionName = "0.9.0"' app/build.gradle.kts
          grep -q 'AccessGateActivity' app/src/main/AndroidManifest.xml

      - name: Build debug and unsigned release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Name APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DuckForce-Companion-v0.9.0-internal-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk DuckForce-Companion-v0.9.0-unsigned-release.apk

      - name: Upload v0.9 APKs
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Companion-v0.9.0-branch-builds
          path: |
            DuckForce-Companion-v0.9.0-internal-debug.apk
            DuckForce-Companion-v0.9.0-unsigned-release.apk
          if-no-files-found: error
          retention-days: 14
