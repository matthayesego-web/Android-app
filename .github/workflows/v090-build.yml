name: v0.9 Faction Automation Build

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read and verify beta metadata
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          case "$VERSION_NAME" in 0.9.*) ;; *) echo "v0.9 branch must stay in 0.9.x"; exit 1;; esac
          grep -q 'AccessGateActivity' app/src/main/AndroidManifest.xml
          grep -q 'DeveloperGateActivity' app/src/main/AndroidManifest.xml
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build debug and unsigned release
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Name APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DuckForce-Companion-v${VERSION_NAME}-internal-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "DuckForce-Companion-v${VERSION_NAME}-unsigned-release.apk"

      - name: Upload v0.9 APKs
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Companion-v${{ env.VERSION_NAME }}-branch-builds
          path: |
            DuckForce-Companion-v${{ env.VERSION_NAME }}-internal-debug.apk
            DuckForce-Companion-v${{ env.VERSION_NAME }}-unsigned-release.apk
          if-no-files-found: error
          retention-days: 14
