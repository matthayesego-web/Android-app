name: TornFCA v0.10.19 Consumption-Only Validation

on:
  push:
    branches: [ develop ]
    paths:
      - 'docs/v01019-consumption-only-trigger.txt'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Record validation run
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01019-consumption-only-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/v01019-consumption-only-run.txt
          git commit -m 'Record consumption-only validation run' || true
          git pull --rebase origin develop
          git push origin HEAD:develop

      - name: Verify candidate and consumption-only Premium model
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.19"' app/build.gradle.kts
          grep -q 'versionCode = 74' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          F='app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java'
          grep -q 'TornFCA Premium is an externally managed entitlement' "$F"
          grep -q 'There are no purchase links, checkout controls, or item-transfer controls in TornFCA' "$F"
          grep -q 'open Torn separately and send Xanax to MattWithADuck' "$F"
          grep -q 'with \\"' "$F"
          grep -q 'after Torn records it, the TornFCA backend verifies the completed transfer' "$F"
          ! grep -q 'https://www.torn.com' "$F"
          ! grep -q 'ACTION_VIEW' "$F"
          ! grep -q 'Uri.parse' "$F"
          ! grep -q 'Purchases unavailable in Play beta' "$F"

      - name: Verify backend contract
        run: |
          set -euo pipefail
          grep -q "TORNFCA_PREMIUM_VERSION='1.3.1'" backend/TornFcaPremiumBackend.gs
          grep -q "TORNFCA_DEFAULT_DAYS_PER_XANAX=7" backend/TornFcaPremiumBackend.gs
          grep -q "required_message','TORNFCA'" backend/TornFcaPremiumBackend.gs
          grep -q 'scanPremiumPayments' backend/TornFcaPremiumBackend.gs
          grep -q 'XANAX_LOG_4103' backend/TornFcaPremiumBackend.gs

      - name: Verify live Premium gate
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 'https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec' -o /tmp/premium.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/premium.json'))
          assert p.get('ok') is True, p
          assert p.get('version') == '1.3.1', p
          assert p.get('monetization_approved') is False, p
          print(p)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Lint, compile and test corrected candidate
        run: gradle --no-daemon :app:lintRelease :app:assembleRelease :app:assembleBeta :app:testDebugUnitTest

      - name: Verify release BuildConfig
        run: |
          set -euo pipefail
          F='app/build/generated/source/buildConfig/release/com/matthayesego/duckforcetoolkit/BuildConfig.java'
          test -f "$F"
          grep -Eq 'PLAY_STORE_BUILD\s*=\s*true' "$F"
          echo 'Consumption-only Play validation passed.'
