name: TEMP Export Android Build Tools

on:
  pull_request:
    branches: [ restore/v0.10.1-source-hardened-2026-08-17 ]

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Export build tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p out/lib
          cp "$BUILD_TOOLS/apksigner" out/
          cp "$BUILD_TOOLS/lib/apksigner.jar" out/lib/
          cp "$BUILD_TOOLS/zipalign" out/
          cp "$BUILD_TOOLS/aapt" out/
          chmod +x out/apksigner out/zipalign out/aapt
      - uses: actions/upload-artifact@v7
        with:
          name: android-build-tools-export
          path: out
          retention-days: 1
