name: TEMP TornFCA v0.10.13 Icon Compile

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify icon hotfix source
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.13"' app/build.gradle.kts
          grep -q 'versionCode = 68' app/build.gradle.kts
          grep -q 'android:icon="@mipmap/ic_launcher_v2"' app/src/main/AndroidManifest.xml
          grep -q 'android:roundIcon="@mipmap/ic_launcher_v2"' app/src/main/AndroidManifest.xml
          grep -q '@drawable/tornfca_launcher_mark_v2' app/src/main/res/mipmap-anydpi/ic_launcher_v2.xml
          grep -q '@drawable/tornfca_launcher_mark_v2' app/src/main/res/mipmap-anydpi-v26/ic_launcher_v2.xml
          grep -q 'android:scaleX="1.30"' app/src/main/res/drawable/tornfca_launcher_mark_v2.xml
          grep -q 'android:scaleY="1.30"' app/src/main/res/drawable/tornfca_launcher_mark_v2.xml
      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta
      - name: Upload unsigned Beta
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.13-icon-hotfix-unsigned
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Publish connector-readable status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/v01013-icon-status"
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init
          git checkout --orphan v01013-icon-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ -f "$GITHUB_WORKSPACE/app/build/outputs/apk/beta/app-beta-unsigned.apk" ]; then
            RESULT=success
            SHA="$(sha256sum "$GITHUB_WORKSPACE/app/build/outputs/apk/beta/app-beta-unsigned.apk" | awk '{print $1}')"
          else
            RESULT=failure
            SHA=unavailable
          fi
          printf 'version=0.10.13\nversion_code=68\nsource_commit=%s\nrun_id=%s\ncompile=%s\nunsigned_sha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$RESULT" "$SHA" > status.txt
          git add status.txt
          git commit -m "Publish v0.10.13 icon compile status"
          git push --force origin HEAD:v01013-icon-status
