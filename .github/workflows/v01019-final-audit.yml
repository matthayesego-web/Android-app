name: TornFCA v0.10.19 Final Pre-Beta Audit

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/v01019-final-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Record exact audit run
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01019-final-audit-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v01019-final-audit-run.txt
          git commit -m 'Record v0.10.19 final audit run' || true
          git pull --rebase origin develop
          git push origin HEAD:develop

      - name: Verify v0.10.19 release identity and winning icon
        run: |
          set -euo pipefail
          grep -q 'versionCode = 74' app/build.gradle.kts
          grep -q 'versionName = "0.10.19"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'applicationId = "com.matthayesego.duckforcetoolkit"' app/build.gradle.kts
          grep -q 'bytes.size == 22878' app/build.gradle.kts
          grep -q '78c2a43859fe6fa72818318373b1c3733a404be38e9c0e03aa37b1973a72042e' app/build.gradle.kts
          grep -q '@drawable/tornfca_launcher_final' app/src/main/res/mipmap-anydpi-v26/ic_launcher_v3.xml
          grep -q '@drawable/tornfca_launcher_final' app/src/main/res/mipmap-anydpi/ic_launcher_v3.xml

      - name: Verify reported regression fixes remain in source
        run: |
          set -euo pipefail
          COMMAND=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          REPAIR=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaUxRepair.java
          CHAT=app/src/main/java/com/matthayesego/duckforcetoolkit/FactionChatActivity.java
          COMMUNITY=backend/TornFcaCommunityBackend.gs
          PREMIUM=backend/TornFcaPremiumBackend.gs

          # Random Operations -> Home regression: preserve active command shell + current section.
          grep -q 'isCommandShell(active).*isLegacyAuthenticatedHome(view)' "$COMMAND"
          grep -q 'String requested=pageHost!=null?currentSection' "$COMMAND"
          grep -q 'intent.putExtra(EXTRA_SECTION,section)' "$COMMAND"

          # Premium badge refresh after entitlement changes.
          grep -q 'currentPlanLabel' "$COMMAND"
          grep -q 'PremiumBackendClient.refreshAsync' "$COMMAND"
          grep -q 'refreshPlanBadgeIfNeeded' "$COMMAND"
          grep -q 'planLabel(int playerId)' "$COMMAND"

          # Duplicate secondary-screen back controls are removed centrally.
          grep -q 'compactReturnRail' "$REPAIR"
          grep -q 'removeLegacyHeaderBackButton(rail)' "$REPAIR"
          grep -q 'startsWith("←")' "$REPAIR"

          # Chat must render optimistically, retry failures, poll quickly, and stay faction scoped.
          grep -q 'POLL_MS=5000L' "$CHAT"
          grep -q 'pendingById' "$CHAT"
          grep -q 'Retry Send' "$CHAT"
          grep -q 'appears here immediately' "$CHAT"
          grep -q 'Faction changed — chat moved to' "$CHAT"
          grep -q "TC_VERSION='1.9.0'" "$COMMUNITY"
          grep -q 'expectedFaction' "$COMMUNITY"
          grep -q 'push_warning' "$COMMUNITY"

          # Premium launch model and complimentary grants.
          grep -q "TORNFCA_PREMIUM_VERSION='1.3.1'" "$PREMIUM"
          grep -q 'TORNFCA_DEFAULT_DAYS_PER_XANAX=7' "$PREMIUM"
          grep -q 'COMPLIMENTARY_GRANT' "$PREMIUM"
          grep -q 'grant_type' "$PREMIUM"
          grep -q 'activations_open' "$PREMIUM"

      - name: Validate manifest security and source consistency
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          manifest=Path('app/src/main/AndroidManifest.xml')
          root=ET.parse(manifest).getroot()
          ns='{http://schemas.android.com/apk/res/android}'
          app=root.find('application')
          errors=[]
          exported_true=[]
          for node in list(app):
              if node.tag not in ('activity','service'): continue
              name=node.get(ns+'name','')
              exported=node.get(ns+'exported')
              if exported=='true': exported_true.append(name)
              if node.tag=='activity' and name.startswith('.') and '$' not in name:
                  cls=name[1:]
                  src=Path('app/src/main/java/com/matthayesego/duckforcetoolkit')/(cls+'.java')
                  if not src.exists(): errors.append(f'Manifest activity source missing: {name}')
          if exported_true != ['.AccessGateActivity']:
              errors.append(f'Unexpected exported main components: {exported_true}')
          if errors:
              raise SystemExit('\n'.join(errors))
          print('Manifest activity sources present; only launcher AccessGateActivity is exported.')
          PY

      - name: Syntax check every Apps Script backend
        run: |
          set -euo pipefail
          mkdir -p /tmp/tornfca-jscheck
          for f in backend/*.gs; do
            out="/tmp/tornfca-jscheck/$(basename "$f" .gs).js"
            cp "$f" "$out"
            node --check "$out"
          done

      - name: Verify the two newly deployed live backends
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 --max-time 30 'https://script.google.com/macros/s/AKfycbwphLmR-N82GJUChzwZlxQ8DGKVoaN6VCNiXvbpKfgJV6JUxlcwPOYVKgbI1h9tmjp-ig/exec' -o /tmp/community.json
          curl -fLsS --retry 3 --retry-delay 2 --max-time 30 'https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec' -o /tmp/premium.json
          python3 - <<'PY'
          import json
          c=json.load(open('/tmp/community.json'))
          p=json.load(open('/tmp/premium.json'))
          assert c.get('ok') is True, c
          assert c.get('app') == 'TornFCA Community Backend', c
          assert c.get('version') == '1.9.0', c
          assert p.get('ok') is True, p
          assert p.get('app') == 'TornFCA Premium Entitlements', p
          assert p.get('version') == '1.3.1', p
          assert p.get('monetization_approved') is False, 'Paid Premium scanner must remain fail-closed for the first beta.'
          print('LIVE COMMUNITY', c.get('version'))
          print('LIVE PREMIUM', p.get('version'), 'monetization_approved=', p.get('monetization_approved'))
          PY

      - name: Require beta Firebase configuration
        env:
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          for v in TORNFCA_FIREBASE_APP_ID TORNFCA_FIREBASE_API_KEY TORNFCA_FIREBASE_PROJECT_ID TORNFCA_FIREBASE_SENDER_ID; do
            test -n "${!v:-}" || { echo "Missing $v"; exit 1; }
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile Debug and unsigned Beta with real beta configuration
        env:
          TORNFCA_COMMUNITY_BACKEND_URL: https://script.google.com/macros/s/AKfycbwphLmR-N82GJUChzwZlxQ8DGKVoaN6VCNiXvbpKfgJV6JUxlcwPOYVKgbI1h9tmjp-ig/exec
          TORNFCA_PREMIUM_BACKEND_URL: https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleBeta :app:testDebugUnitTest :app:lintBeta

      - name: Verify APK identities and winner icon payload
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          DEBUG=app/build/outputs/apk/debug/app-debug.apk
          BETA=app/build/outputs/apk/beta/app-beta-unsigned.apk
          "$AAPT" dump badging "$DEBUG" | tee debug-badging.txt
          "$AAPT" dump badging "$BETA" | tee beta-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit.internal'" debug-badging.txt
          grep -q "versionCode='74'" debug-badging.txt
          grep -q "versionName='0.10.19-internal'" debug-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit.beta'" beta-badging.txt
          grep -q "versionCode='74'" beta-badging.txt
          grep -q "versionName='0.10.19-beta'" beta-badging.txt
          ICON=app/build/generated/tornfcaIconRes/drawable-nodpi/tornfca_launcher_final.webp
          echo '78c2a43859fe6fa72818318373b1c3733a404be38e9c0e03aa37b1973a72042e  '"$ICON" | sha256sum -c -

      - name: Confirm this audit did not sign anything
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/tornfca-release.keystore"
          echo 'Final audit is compile/test only. Permanent signing was not used.'

      - name: Upload static audit evidence
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v0.10.19-static-audit
          path: |
            debug-badging.txt
            beta-badging.txt
            app/build/reports/lint-results-beta.html
          if-no-files-found: error
          retention-days: 14

  emulator-runtime:
    needs: static-and-build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout audited develop source
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Add temporary debug-only internal activity launcher
        run: |
          set -euo pipefail
          PKGDIR=app/src/debug/java/com/matthayesego/duckforcetoolkit
          mkdir -p "$PKGDIR"
          cat > "$PKGDIR/RuntimeSmokeHarnessActivity.java" <<'JAVA'
          package com.matthayesego.duckforcetoolkit;
          import android.app.Activity;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.TextView;
          public class RuntimeSmokeHarnessActivity extends Activity {
              @Override protected void onCreate(Bundle state){
                  super.onCreate(state);
                  TextView v=new TextView(this);v.setText("TornFCA runtime smoke harness");setContentView(v);
                  String target=getIntent().getStringExtra("target");
                  if(target==null||target.trim().isEmpty())return;
                  try{
                      Class<?> cls=Class.forName("com.matthayesego.duckforcetoolkit."+target);
                      Intent i=new Intent(this,cls);
                      i.putExtra("faction_id",1);i.putExtra("faction_name","Runtime Smoke");i.putExtra("war_id",1L);
                      startActivity(i);
                  }catch(Exception e){throw new RuntimeException("Smoke launch failed for "+target,e);}
              }
          }
          JAVA
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/debug/AndroidManifest.xml')
          t=p.read_text()
          marker='        <activity android:name=".RuntimeSmokeHarnessActivity" android:exported="true" />\n'
          if marker not in t:t=t.replace('    </application>',marker+'    </application>')
          p.write_text(t)
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build runtime Debug APK
        env:
          TORNFCA_COMMUNITY_BACKEND_URL: https://script.google.com/macros/s/AKfycbwphLmR-N82GJUChzwZlxQ8DGKVoaN6VCNiXvbpKfgJV6JUxlcwPOYVKgbI1h9tmjp-ig/exec
          TORNFCA_PREMIUM_BACKEND_URL: https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and exercise major activities
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set -euo pipefail
            PKG=com.matthayesego.duckforcetoolkit.internal
            APK=app/build/outputs/apk/debug/app-debug.apk
            adb wait-for-device
            adb install -r "$APK"
            adb shell pm clear "$PKG"
            adb logcat -c

            # Public launch/login path.
            adb shell am start -W -n "$PKG/com.matthayesego.duckforcetoolkit.AccessGateActivity"
            sleep 3
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            adb exec-out screencap -p > runtime-login.png
            adb logcat -d -v time > runtime-login-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-login-logcat.txt

            # Debug authenticated visual preview used by existing TornFCA visual QA.
            adb logcat -c
            adb shell am start -W -n "$PKG/com.matthayesego.duckforcetoolkit.VisualPreviewActivity"
            sleep 4
            test -n "$(adb shell pidof "$PKG" | tr -d '\r')"
            adb exec-out screencap -p > runtime-command-preview.png
            adb logcat -d -v time > runtime-command-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-command-logcat.txt

            # Launch non-exported major screens from inside the app UID through the debug harness.
            : > runtime-activity-results.txt
            for target in \
              BetaCommandActivity NotificationInboxActivity SettingsActivity LegalActivity MoreActivity \
              MemberCenterActivity MemberDirectoryActivity FactionResourcesActivity FactionChatActivity \
              TrainingCenterActivity TrainingProgressActivity WarPrepActivity WarHubActivity \
              WarCenterActivity TerritoryWarActivity OcTrackerActivity QuickIntelActivity \
              FactionOpsActivity BankingCompanionActivity PremiumPreviewActivity PremiumInsightsActivity \
              PremiumActivityTrendsActivity LeadershipAttentionActivity CommunityModerationActivity \
              DeveloperGateActivity PremiumAdminActivity; do
                adb shell am force-stop "$PKG"
                adb logcat -c
                adb shell am start -W -n "$PKG/com.matthayesego.duckforcetoolkit.RuntimeSmokeHarnessActivity" --es target "$target" >> runtime-activity-results.txt 2>&1
                sleep 2
                test -n "$(adb shell pidof "$PKG" | tr -d '\r')" || { echo "$target killed app process"; adb logcat -d -v time; exit 1; }
                adb logcat -d -v time > "logcat-$target.txt"
                if grep -q 'FATAL EXCEPTION' "logcat-$target.txt"; then
                  echo "FATAL EXCEPTION while exercising $target"
                  cat "logcat-$target.txt"
                  exit 1
                fi
                echo "PASS $target" >> runtime-activity-results.txt
            done

            # Launcher icon proof from Android's own app-info surface.
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d "package:$PKG"
            sleep 3
            adb exec-out screencap -p > runtime-icon.png
            adb logcat -d -v time > runtime-final-logcat.txt
            ! grep -q 'FATAL EXCEPTION' runtime-final-logcat.txt

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v0.10.19-runtime-audit
          path: |
            runtime-login.png
            runtime-command-preview.png
            runtime-icon.png
            runtime-activity-results.txt
            runtime-login-logcat.txt
            runtime-command-logcat.txt
            runtime-final-logcat.txt
            logcat-*.txt
          if-no-files-found: warn
          retention-days: 14
