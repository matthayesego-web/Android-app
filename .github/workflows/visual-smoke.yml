name: Android Visual Smoke Test

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and capture visual proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.matthayesego.duckforcetoolkit
            adb shell am start -W -n com.matthayesego.duckforcetoolkit/.PolishedCompanionActivity
            sleep 3
            adb exec-out screencap -p > visual-login.png
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml visual-window.xml
            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d package:com.matthayesego.duckforcetoolkit
            sleep 3
            adb exec-out screencap -p > visual-icon.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-visual-smoke
          path: |
            visual-login.png
            visual-icon.png
            visual-window.xml
          if-no-files-found: error
