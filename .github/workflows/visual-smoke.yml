name: Android Visual Smoke Test

on:
  push:
    branches: [ main, v0.7-dashboard-premium-prep ]
    paths-ignore:
      - 'dist/**'
      - '**/*.md'
  workflow_dispatch:

jobs:
  visual-smoke:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Boot emulator and capture visual proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell cmd package list packages >/dev/null
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.matthayesego.duckforcetoolkit.internal
            adb logcat -c
            sleep 10

            adb shell am start -W -n com.matthayesego.duckforcetoolkit.internal/com.matthayesego.duckforcetoolkit.PolishedCompanionActivity
            sleep 15
            adb shell dumpsys activity activities > activity-login.txt
            adb shell pidof com.matthayesego.duckforcetoolkit.internal > pid-login.txt
            test -s pid-login.txt
            grep -q "PolishedCompanionActivity" activity-login.txt
            adb exec-out screencap -p > visual-login.png

            adb shell am start -W -n com.matthayesego.duckforcetoolkit.internal/com.matthayesego.duckforcetoolkit.VisualPreviewActivity
            sleep 8
            adb shell dumpsys activity activities > activity-home.txt
            adb shell pidof com.matthayesego.duckforcetoolkit.internal > pid-home.txt
            test -s pid-home.txt
            grep -q "VisualPreviewActivity" activity-home.txt
            adb exec-out screencap -p > visual-home.png

            adb logcat -d -v time > logcat-smoke.txt
            ! grep -q "FATAL EXCEPTION" logcat-smoke.txt

            adb shell am start -W -a android.settings.APPLICATION_DETAILS_SETTINGS -d "package:com.matthayesego.duckforcetoolkit.internal"
            sleep 15
            adb shell dumpsys window windows > window-icon.txt
            adb exec-out screencap -p > visual-icon.png

      - name: Upload visual proof
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-visual-smoke
          path: |
            visual-login.png
            visual-home.png
            visual-icon.png
            logcat-smoke.txt
            activity-login.txt
            activity-home.txt
            window-icon.txt
            pid-login.txt
            pid-home.txt
          if-no-files-found: error
