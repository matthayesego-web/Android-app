name: Export v0.4.3 Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Publish build output to repository
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/DuckForce-Companion-v0.4.3-unsigned-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/DuckForce-Companion-v0.4.3-unsigned-release.apk
          git commit -m "Export v0.4.3 unsigned release APK" || exit 0
          git push
