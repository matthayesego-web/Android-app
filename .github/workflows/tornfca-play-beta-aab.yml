name: Build TornFCA Play Beta AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-play-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
      TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
      TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
      TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout promoted Play source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read candidate version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Validate Play candidate inputs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$TORNFCA_FIREBASE_APP_ID"
          test -n "$TORNFCA_FIREBASE_API_KEY"
          test -n "$TORNFCA_FIREBASE_PROJECT_ID"
          test -n "$TORNFCA_FIREBASE_SENDER_ID"
          grep -q 'applicationId = "com.matthayesego.duckforcetoolkit"' app/build.gradle.kts
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionName = "0.10.19"' app/build.gradle.kts
          grep -q 'versionCode = 74' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          grep -q 'firebase_analytics_collection_enabled' app/src/main/AndroidManifest.xml
          grep -q 'firebase_messaging_auto_init_enabled' app/src/main/AndroidManifest.xml
          grep -q 'PlayReviewActivity' app/src/main/AndroidManifest.xml
          grep -q 'buildConfigField("boolean", "PLAY_STORE_BUILD", "true")' app/build.gradle.kts
          grep -q 'if(BuildConfig.PLAY_STORE_BUILD)' app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java
          grep -q 'There are no purchase links, checkout controls, or item-transfer controls in TornFCA' app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java
          grep -q 'open Torn separately and send Xanax to MattWithADuck' app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java

      - name: Verify live Premium backend
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 2 'https://script.google.com/macros/s/AKfycbxGp-l6UYQb6MzSSWrhHMo9QNuYlsJfvw1c2qYxdoPnFr-G5TxeUOFOgr1ziOZHpWi7/exec' -o /tmp/premium.json
          python3 - <<'PY'
          import json, os
          p=json.load(open('/tmp/premium.json'))
          assert p.get('ok') is True, p
          assert p.get('version') == '1.3.1', p
          approved = bool(p.get('monetization_approved'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PREMIUM_MONETIZATION_APPROVED=' + ('true' if approved else 'false') + '\n')
          print('Premium backend',p.get('version'),'monetization_approved=',approved)
          PY

      - name: Syntax-check Apps Script source
        run: |
          set -euo pipefail
          for file in backend/*.gs; do
            cp "$file" "/tmp/$(basename "$file").js"
            node --check "/tmp/$(basename "$file").js"
          done

      - name: Lint and build normal-package Play bundle
        run: gradle --no-daemon :app:lintRelease :app:bundleRelease

      - name: Verify compiled release is Play consumption-only
        run: |
          set -euo pipefail
          BUILD_CONFIG='app/build/generated/source/buildConfig/release/com/matthayesego/duckforcetoolkit/BuildConfig.java'
          test -f "$BUILD_CONFIG"
          grep -Eq 'PLAY_STORE_BUILD\s*=\s*true' "$BUILD_CONFIG"
          test -f app/build/outputs/bundle/release/app-release.aab
          unzip -t app/build/outputs/bundle/release/app-release.aab >/dev/null

      - name: Reconstruct permanent upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tornfca-release.jks"
          chmod 600 "$RUNNER_TEMP/tornfca-release.jks"

      - name: Verify upload signing certificate
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$RUNNER_TEMP/tornfca-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | tee signing-certificate.txt
          grep -qi 'C3:EC:C3:5A:64:F8:E7:EC:ED:DA:1C:A4:6D:5F:E0:84:1B:89:0E:ED:9C:78:CC:B6:71:6D:61:A9:23:7F:03:22' signing-certificate.txt

      - name: Sign Play AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          INPUT=app/build/outputs/bundle/release/app-release.aab
          OUTPUT="TornFCA-v${VERSION_NAME}-Play-Beta.aab"
          test -f "$INPUT"
          cp "$INPUT" "$OUTPUT"
          jarsigner \
            -keystore "$RUNNER_TEMP/tornfca-release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            "$OUTPUT" "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$OUTPUT" | tee aab-signing-verification.txt
          grep -qi 'jar verified' aab-signing-verification.txt
          sha256sum "$OUTPUT" | tee aab-sha256.txt

      - name: Record candidate metadata
        run: |
          set -euo pipefail
          {
            echo "TornFCA Play Beta Candidate"
            echo "versionName=${VERSION_NAME}"
            echo "versionCode=${VERSION_CODE}"
            echo "package=com.matthayesego.duckforcetoolkit"
            echo "source=${GITHUB_SHA}"
            echo "targetSdk=36"
            echo "playStoreBuild=true"
            echo "premiumModel=consumption-only"
            echo "premiumPurchaseLinks=false"
            echo "premiumTransferControls=false"
            echo "premiumExternalInstructions=plain-text-only"
            echo "premiumMonetizationApproved=${PREMIUM_MONETIZATION_APPROVED}"
            echo "signed=true"
          } | tee play-candidate-metadata.txt

      - name: Upload signed Play candidate
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v${{ env.VERSION_NAME }}-signed-Play-Beta-AAB
          path: |
            TornFCA-v${{ env.VERSION_NAME }}-Play-Beta.aab
            play-candidate-metadata.txt
            signing-certificate.txt
            aab-signing-verification.txt
            aab-sha256.txt
            app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tornfca-release.jks"
