name: TEMP TornFCA v0.10.11 Compile

on:
  push:
    branches: [ work/v0.10.11-banking-cache-hotfix ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Verify hotfix markers
        id: markers
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.11"' app/build.gradle.kts
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'StartupWarmup.hasStartedThisProcess' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q 'renderSafe' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingCompanionActivity.java
          grep -q '45L\*60L\*1000L' app/src/main/java/com/matthayesego/duckforcetoolkit/BankingCompanionActivity.java
      - name: Syntax check backends
        id: backend_syntax
        run: |
          set -euo pipefail
          for file in backend/AccessBackend.gs backend/TornFcaCommunityBackend.gs backend/TornFcaPremiumBackend.gs backend/TornFcaDeveloperBackend.gs backend/TornFcaWarPayBackend.gs backend/TornFcaFeedbackBackend.gs; do
            cp "$file" "/tmp/$(basename "$file").js"
            node --check "/tmp/$(basename "$file").js"
          done
      - name: Compile Beta
        id: compile_beta
        run: gradle --no-daemon :app:assembleBeta
      - name: Publish compile status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MARKERS: ${{ steps.markers.outcome }}
          BACKENDS: ${{ steps.backend_syntax.outcome }}
          COMPILE: ${{ steps.compile_beta.outcome }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/v01011-status"
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init
          git checkout --orphan v01011-test-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          printf 'source_commit=%s\nmarkers=%s\nbackend_syntax=%s\ncompile=%s\n' "$GITHUB_SHA" "${MARKERS:-unknown}" "${BACKENDS:-unknown}" "${COMPILE:-unknown}" > status.txt
          git add status.txt
          git commit -m "Publish v0.10.11 test status"
          git push --force origin HEAD:v01011-test-status
