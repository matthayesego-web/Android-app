name: TornFCA Premium Display Gate Cleanup

on:
  push:
    branches: [ work/v0.10.18-beta-hardening ]
    paths:
      - '.github/workflows/tornfca-display-gate-cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening
          fetch-depth: 0
      - name: Patch display-only verified Premium checks
        shell: python
        run: |
          from pathlib import Path
          fixes={
            'app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java':(
              'boolean verifiedPremium=identity.playerId>0&&PremiumEntitlementStore.hasPremium(this,identity.playerId);',
              'boolean verifiedPremium=identity.playerId>0&&PremiumEntitlementStore.TIER_PREMIUM.equals(PremiumEntitlementStore.tier(this,identity.playerId));'),
            'app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java':(
              'boolean premium=PremiumAccess.has(this,player,PremiumAccess.PERSONAL_INSIGHTS),verifiedPremium=PremiumEntitlementStore.hasPremium(this,player),leader=currentLeader();',
              'boolean premium=PremiumAccess.has(this,player,PremiumAccess.PERSONAL_INSIGHTS),verifiedPremium=PremiumEntitlementStore.TIER_PREMIUM.equals(PremiumEntitlementStore.tier(this,player)),leader=currentLeader();')}
          for path,(old,new) in fixes.items():
            p=Path(path);t=p.read_text()
            if new in t: continue
            if old not in t: raise SystemExit(f'Marker not found in {path}')
            p.write_text(t.replace(old,new,1))
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:compileBetaJavaWithJavac
      - name: Commit compiled cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Keep Premium display checks outside entitlement gate path'
          git pull --rebase origin work/v0.10.18-beta-hardening
          git push origin HEAD:work/v0.10.18-beta-hardening
