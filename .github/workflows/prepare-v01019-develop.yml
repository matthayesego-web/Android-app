name: Prepare v0.10.19 Develop

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/prepare-v01019-develop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Set v0.10.19 build 74
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          t=p.read_text()
          old=t
          t=t.replace('versionCode = 73','versionCode = 74',1)
          t=t.replace('versionName = "0.10.18"','versionName = "0.10.19"',1)
          if t==old:
              if 'versionCode = 74' not in t or 'versionName = "0.10.19"' not in t:
                  raise SystemExit('Expected version markers were not found')
          p.write_text(t)
          PY

      - name: Verify winner icon source markers
        run: |
          grep -q 'bytes.size == 22878' app/build.gradle.kts
          grep -q '78c2a43859fe6fa72818318373b1c3733a404be38e9c0e03aa37b1973a72042e' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile Debug and Beta before commit
        run: gradle --no-daemon :app:assembleDebug :app:assembleBeta

      - name: Commit version line
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git commit -m 'Prepare TornFCA v0.10.19 build 74 on develop' || true
          git pull --rebase origin develop
          git push origin HEAD:develop
