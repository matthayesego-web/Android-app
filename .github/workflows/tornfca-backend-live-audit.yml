name: TornFCA Backend Live Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-live-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.10.18 beta source
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening

      - name: Verify backend source versions, isolation safeguards and syntax
        run: |
          set -euo pipefail
          FACTION=backend/AccessBackend.gs
          COMMUNITY=backend/TornFcaCommunityBackend.gs
          PREMIUM=backend/TornFcaPremiumBackend.gs
          DEVELOPER=backend/TornFcaDeveloperBackend.gs
          WARPAY=backend/TornFcaWarPayBackend.gs

          grep -q "const DF_TOOLKIT_VERSION='1.1.1'" "$FACTION"
          grep -q "const TC_VERSION='1.9.0'" "$COMMUNITY"
          grep -q "const TORNFCA_PREMIUM_VERSION='1.3.1'" "$PREMIUM"
          grep -q "const TD_VERSION='1.5.0'" "$DEVELOPER"
          grep -q "const TW_VERSION='1.1.0'" "$WARPAY"

          grep -q 'function setupTornFcaFactionBackend' "$FACTION"
          grep -q 'function setupTornFcaCommunityBackend' "$COMMUNITY"
          grep -q 'function setupTornFcaPremiumBackend' "$PREMIUM"
          grep -q 'function setupTornFcaDeveloperBackend' "$DEVELOPER"
          grep -q 'function setupTornFcaWarPayBackend' "$WARPAY"

          # Every tenant-sensitive backend must verify Torn faction identity.
          grep -q "tornGet_('/user/faction',apiKey)" "$FACTION"
          grep -q "tcTornGet_('/user/faction',apiKey)" "$COMMUNITY"
          grep -q "twTornGet_('/user/faction',apiKey)" "$WARPAY"

          # Chat stays bounded, faction-scoped and rejects a stale client send after faction change.
          grep -q 'TC_CHAT_SCAN_LIMIT=5000' "$COMMUNITY"
          grep -q 'TC_CHAT_CHUNK=500' "$COMMUNITY"
          grep -q 'expectedFaction!==Number(user.faction_id' "$COMMUNITY"
          grep -q "tcRate_(user.id,'chat_send',1)" "$COMMUNITY"
          grep -q 'push_warning' "$COMMUNITY"
          grep -q "action==='chat_send'.*user:tcPublicUser_" "$COMMUNITY"
          awk '/function tcReadChat_/{flag=1} flag{print} flag && /^}/{exit}' "$COMMUNITY" > /tmp/community-chat.txt
          ! grep -q 'getDataRange' /tmp/community-chat.txt

          # Premium remains fail-closed and publishes only non-secret activation metadata.
          grep -q 'TORNFCA_DEFAULT_DAYS_PER_XANAX=7' "$PREMIUM"
          grep -q 'payment_player_id:TORNFCA_PREMIUM_DEVELOPER_ID' "$PREMIUM"
          grep -q 'activations_open:premiumMonetizationApproved_()' "$PREMIUM"
          grep -q "setProperty('MONETIZATION_APPROVED','false')" "$PREMIUM"
          grep -q 'if(!premiumMonetizationApproved_())throw new Error' "$PREMIUM"
          grep -q "receiptSource='XANAX_LOG_4103:'" "$PREMIUM"

          for file in "$FACTION" "$COMMUNITY" "$PREMIUM" "$DEVELOPER" "$WARPAY"; do cp "$file" "/tmp/$(basename "$file").js"; node --check "/tmp/$(basename "$file").js"; done

      - name: Validate backend and Firebase deployment secrets
        env:
          TORNFCA_FACTION_BACKEND_URL: ${{ secrets.TORNFCA_FACTION_BACKEND_URL }}
          TORNFCA_COMMUNITY_BACKEND_URL: ${{ secrets.TORNFCA_COMMUNITY_BACKEND_URL }}
          TORNFCA_PREMIUM_BACKEND_URL: ${{ secrets.TORNFCA_PREMIUM_BACKEND_URL }}
          TORNFCA_DEVELOPER_BACKEND_URL: ${{ secrets.TORNFCA_DEVELOPER_BACKEND_URL }}
          TORNFCA_WARPAY_BACKEND_URL: ${{ secrets.TORNFCA_WARPAY_BACKEND_URL }}
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          for var in TORNFCA_FACTION_BACKEND_URL TORNFCA_COMMUNITY_BACKEND_URL TORNFCA_PREMIUM_BACKEND_URL TORNFCA_DEVELOPER_BACKEND_URL TORNFCA_WARPAY_BACKEND_URL; do value="${!var:-}"; test -n "$value" || { echo "Missing $var"; exit 1; }; case "$value" in https://*) ;; *) echo "$var must use HTTPS"; exit 1;; esac; done
          for var in TORNFCA_FIREBASE_APP_ID TORNFCA_FIREBASE_API_KEY TORNFCA_FIREBASE_PROJECT_ID TORNFCA_FIREBASE_SENDER_ID; do test -n "${!var:-}" || { echo "Missing $var"; exit 1; }; done

      - name: Verify deployed backend identities and exact target versions
        env:
          TORNFCA_FACTION_BACKEND_URL: ${{ secrets.TORNFCA_FACTION_BACKEND_URL }}
          TORNFCA_COMMUNITY_BACKEND_URL: ${{ secrets.TORNFCA_COMMUNITY_BACKEND_URL }}
          TORNFCA_PREMIUM_BACKEND_URL: ${{ secrets.TORNFCA_PREMIUM_BACKEND_URL }}
          TORNFCA_DEVELOPER_BACKEND_URL: ${{ secrets.TORNFCA_DEVELOPER_BACKEND_URL }}
          TORNFCA_WARPAY_BACKEND_URL: ${{ secrets.TORNFCA_WARPAY_BACKEND_URL }}
        run: |
          set -euo pipefail
          check_backend(){ url="$1"; expected="$2"; version="$3"; body="$(curl --fail --silent --show-error --location --max-time 25 "$url")"; printf '%s\n' "$body" | grep -F '"ok":true' >/dev/null; printf '%s\n' "$body" | grep -F "$expected" >/dev/null; printf '%s\n' "$body" | grep -F '"version":"'"$version"'"' >/dev/null; }
          check_backend "$TORNFCA_FACTION_BACKEND_URL" 'TornFCA Faction Backend' '1.1.1'
          check_backend "$TORNFCA_COMMUNITY_BACKEND_URL" 'TornFCA Community Backend' '1.9.0'
          check_backend "$TORNFCA_PREMIUM_BACKEND_URL" 'TornFCA Premium Entitlements' '1.3.1'
          check_backend "$TORNFCA_DEVELOPER_BACKEND_URL" 'TornFCA Developer Control Plane' '1.5.0'
          check_backend "$TORNFCA_WARPAY_BACKEND_URL" 'TornFCA WarPay Backend' '1.1.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile backend-enabled Beta and release candidate
        env:
          TORNFCA_FACTION_BACKEND_URL: ${{ secrets.TORNFCA_FACTION_BACKEND_URL }}
          TORNFCA_COMMUNITY_BACKEND_URL: ${{ secrets.TORNFCA_COMMUNITY_BACKEND_URL }}
          TORNFCA_PREMIUM_BACKEND_URL: ${{ secrets.TORNFCA_PREMIUM_BACKEND_URL }}
          TORNFCA_DEVELOPER_BACKEND_URL: ${{ secrets.TORNFCA_DEVELOPER_BACKEND_URL }}
          TORNFCA_WARPAY_BACKEND_URL: ${{ secrets.TORNFCA_WARPAY_BACKEND_URL }}
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:assembleBeta :app:assembleRelease

      - name: Verify package identities
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"; AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"; test -x "$AAPT"
          BETA=app/build/outputs/apk/beta/app-beta-unsigned.apk; RELEASE=app/build/outputs/apk/release/app-release-unsigned.apk
          "$AAPT" dump badging "$BETA" | tee beta-badging.txt; "$AAPT" dump badging "$RELEASE" | tee release-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit.beta'" beta-badging.txt
          grep -q "application-label:'Torn FCA Beta'" beta-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit'" release-badging.txt

      - uses: actions/upload-artifact@v7
        with:
          name: TornFCA-backend-live-audit-evidence
          path: |
            beta-badging.txt
            release-badging.txt
          if-no-files-found: error
          retention-days: 30
