name: Torn FCA Beta Overhaul Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify side-by-side beta overhaul
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts
          HOTFIX=app/src/main/java/com/matthayesego/duckforcetoolkit/CurrentShellVisualHotfix.java
          test -f app/src/main/res/drawable/tornfca_beta_crest.xml
          test -f app/src/beta/res/mipmap-anydpi-v26/ic_launcher.xml
          test -f app/src/beta/res/mipmap-anydpi/ic_launcher.xml
          grep -q 'versionName = "0.9.32"' "$GRADLE"
          grep -q 'versionCode = 49' "$GRADLE"
          grep -q 'applicationIdSuffix = ".beta"' "$GRADLE"
          grep -q 'manifestPlaceholders\["appLabel"\] = "Torn FCA Beta"' "$GRADLE"
          grep -q 'BuildConfig.APPLICATION_ID.endsWith(".beta")' "$HOTFIX"
          grep -q 'R.drawable.tornfca_beta_crest' "$HOTFIX"
          grep -q 'styleHeroHeader' "$HOTFIX"
          grep -q 'styleCard' "$HOTFIX"
          grep -q 'polishCurrentNavItem' "$HOTFIX"
          grep -q 'replace("Duck Force","Faction")' "$HOTFIX"
          echo 'Torn FCA Beta overhaul audit passed.'
