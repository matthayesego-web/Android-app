name: Torn FCA Beta Overhaul Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify repaired beta command surface live gauges and UX repairs
        run: |
          set -euo pipefail
          GRADLE=app/build.gradle.kts
          GATE=app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          BASE=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaActivity.java
          BETA=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          UI=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCommandUi.java
          SURFACE=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaSurfacePolish.java
          GAUGES=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaGaugeLiveData.java
          UX=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaUxRepair.java
          WRAPPERS=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaScreens.java
          DEV_BACKEND=backend/TornFcaDeveloperBackend.gs
          DEV_CLIENT=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperBackendClient.java
          DEV_UI=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperBackendActivity.java

          test -f "$BETA"
          test -f "$UI"
          test -f "$SURFACE"
          test -f "$GAUGES"
          test -f "$UX"
          grep -q 'versionName = "0.9.38"' "$GRADLE"
          grep -q 'versionCode = 55' "$GRADLE"
          grep -q 'applicationIdSuffix = ".beta"' "$GRADLE"
          grep -q 'BetaSurfacePolish.install' "$GATE"
          grep -q 'BetaGaugeLiveData.install' "$GATE"
          grep -q 'BetaUxRepair.install' "$GATE"
          grep -q 'isBetaCommandActivity' "$BASE"
          grep -q 'BetaSurfacePolish.apply' "$WRAPPERS"

          # Main pages remain structurally distinct.
          grep -q 'addStatusHero' "$BETA"
          grep -q 'addDuoGrid' "$BETA"
          grep -q 'Member Network' "$BETA"
          grep -q 'Training Lab' "$BETA"
          grep -q 'Operations Command' "$BETA"
          grep -q 'App Control' "$BETA"

          # Gauge modules remain readable/clickable and consume real data.
          grep -q 'final Runnable action' "$BETA"
          grep -q 's.action' "$BETA"
          grep -q 'metricTile(Activity a,String eyebrow,String center,String title,String detail,int accent,Runnable action)' "$UI"
          grep -q 'tile.setOnClickListener' "$UI"
          grep -q '/user?selections=bars' "$GAUGES"
          grep -q '/user/battlestats' "$GAUGES"
          grep -q 'tornfca_war_prep_v1' "$GAUGES"
          grep -q 'NotificationInboxStore.all' "$GAUGES"
          grep -q 'LiveGaugeView' "$GAUGES"

          # Preserved v0.9.36 UX repairs: truthful refills, compact return control, dedicated icons, developer entry.
          grep -q '/user/refills' "$UX"
          grep -q 'Used today' "$UX"
          grep -q 'special_count' "$UX"
          grep -q 'DeveloperGateActivity.class' "$UX"
          grep -q 'DEVELOPER_PLAYER_ID' "$UX"
          grep -q 'tornfca-beta-context-rail-compact' "$UX"
          grep -q 'ic_beta_settings' "$UX"
          grep -q 'ic_beta_notifications' "$UX"
          grep -q 'ic_beta_more' "$UX"
          test -f app/src/main/res/drawable/ic_beta_settings.xml
          test -f app/src/main/res/drawable/ic_beta_notifications.xml
          test -f app/src/main/res/drawable/ic_beta_privacy.xml
          test -f app/src/main/res/drawable/ic_beta_info.xml
          test -f app/src/main/res/drawable/ic_beta_premium.xml
          test -f app/src/main/res/drawable/ic_beta_developer.xml
          test -f app/src/main/res/drawable/ic_beta_more.xml

          # v0.9.38 developer telemetry remains aggregate, low-write and owner-visible only.
          grep -q "const TD_VERSION='1.2.0'" "$DEV_BACKEND"
          grep -q "const TD_USERS='DeveloperUsers'" "$DEV_BACKEND"
          grep -q 'TD_HEARTBEAT_SECONDS=6\*60\*60' "$DEV_BACKEND"
          grep -q 'total_unique' "$DEV_BACKEND"
          grep -q 'current_total' "$DEV_BACKEND"
          grep -q 'TELEMETRY_SALT' "$DEV_BACKEND"
          grep -q 'version_code' "$DEV_CLIENT"
          grep -q 'version_name' "$DEV_CLIENT"
          grep -q 'User tracker' "$DEV_UI"
          grep -q 'Current total' "$DEV_UI"
          grep -q 'Unique users' "$DEV_UI"

          echo 'Torn FCA Beta v0.9.38 UX/backend-preservation audit passed.'
