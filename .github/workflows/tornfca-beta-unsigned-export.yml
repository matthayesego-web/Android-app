name: TornFCA Beta Unsigned Export

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile unsigned Beta
        run: gradle --no-daemon :app:assembleBeta

      - name: Upload unsigned Beta
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.8-unsigned-export
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish export status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/tornfca-beta-unsigned-status"
          rm -rf "$PUB"; mkdir -p "$PUB"; cd "$PUB"
          git init
          git checkout --orphan beta-unsigned-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          printf 'run_id=%s\nsource_commit=%s\nartifact=TornFCA-Beta-v0.10.8-unsigned-export\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > status.txt
          git add status.txt
          git commit -m "Publish unsigned Beta export status"
          git push --force origin HEAD:beta-unsigned-status
