name: Build v0.3.0 Feature APK

on:
  push:
    branches:
      - agent/polish-listener-v030
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk DuckForce-Torn-Toolkit-v0.3.0.apk
      - uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Torn-Toolkit-v0.3.0
          path: DuckForce-Torn-Toolkit-v0.3.0.apk
          if-no-files-found: error
          retention-days: 30
