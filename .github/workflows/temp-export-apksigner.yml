name: TEMP Export Android APK Signer
# One-time local signing support for Beta recovery builds.

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Package APK signer tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          test -f "$BUILD_TOOLS/lib/apksigner.jar"
          mkdir -p exported-tools
          cp "$BUILD_TOOLS/lib/apksigner.jar" exported-tools/apksigner.jar
          if [ -x "$BUILD_TOOLS/zipalign" ]; then cp "$BUILD_TOOLS/zipalign" exported-tools/zipalign; fi
          if [ -x "$BUILD_TOOLS/aapt" ]; then cp "$BUILD_TOOLS/aapt" exported-tools/aapt; fi
          if [ -d "$BUILD_TOOLS/lib64" ]; then cp -R "$BUILD_TOOLS/lib64" exported-tools/lib64; fi
          printf 'build_tools=%s\nrun_id=%s\n' "$(basename "$BUILD_TOOLS")" "$GITHUB_RUN_ID" > exported-tools/info.txt
      - name: Upload tools
        uses: actions/upload-artifact@v7
        with:
          name: tornfca-apksigner-tools
          path: exported-tools
          if-no-files-found: error
          retention-days: 1
      - name: Publish tool export status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/apksigner-tool-status"
          rm -rf "$PUB" && mkdir -p "$PUB" && cd "$PUB"
          git init
          git checkout --orphan apksigner-tool-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          printf 'run_id=%s\nsource_commit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > status.txt
          git add status.txt
          git commit -m "Publish APK signer tool export status"
          git push --force origin HEAD:apksigner-tool-status
