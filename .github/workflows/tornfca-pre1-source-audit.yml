name: TornFCA Pre-1.0 Source Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify v0.10.4 source release gates
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.10.4"' app/build.gradle.kts
          grep -q 'versionCode = 59' app/build.gradle.kts
          grep -q 'applicationIdSuffix = ".beta"' app/build.gradle.kts
          ! grep -q 'DEVELOPER_ACCESS_SHA256' app/build.gradle.kts

          BRAND=app/src/main/res/drawable/tornfca_mark.xml
          LAUNCH=app/src/main/res/drawable/tornfca_launcher_mark.xml
          test -f "$BRAND"; test -f "$LAUNCH"
          grep -q 'Official TornFCA Network Helix brand mark' "$BRAND"
          grep -q 'Simplified Network Helix launcher mark' "$LAUNCH"
          grep -q '#29E6FF' "$BRAND"
          grep -q '#9A5CFF' "$BRAND"
          grep -q '@drawable/tornfca_launcher_mark' app/src/main/res/mipmap-anydpi/ic_launcher.xml
          grep -q '@drawable/tornfca_launcher_mark' app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

          ABOUT=app/src/main/java/com/matthayesego/duckforcetoolkit/AboutActivity.java
          GATE=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperGateActivity.java
          SESSION=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperSessionStore.java
          ACCESS_UI=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperAccessActivity.java
          PANEL=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperPanelActivity.java
          CLIENT=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperBackendClient.java
          UX=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaUxRepair.java
          MANIFEST=app/src/main/AndroidManifest.xml

          grep -q 'versionTaps>=5' "$ABOUT"
          grep -q 'DeveloperGateActivity.class' "$ABOUT"
          ! grep -q 'DeveloperGateActivity.class' "$UX"
          grep -q 'developerLogin' "$GATE"
          grep -q '6-digit authenticator code' "$GATE"
          grep -q 'Enroll with Invitation Code' "$GATE"
          grep -q 'AndroidKeyStore' "$SESSION"
          grep -q 'Developer Access' "$ACCESS_UI"
          grep -q 'Create Invitation' "$ACCESS_UI"
          grep -q 'Reset / Re-enroll' "$ACCESS_UI"
          grep -q 'Sign Out of Developer Channel' "$PANEL"
          grep -q 'developer_login' "$CLIENT"
          grep -q 'developer_enroll_begin' "$CLIENT"
          grep -q 'developer_access_list' "$CLIENT"
          grep -q 'DeveloperAccessActivity" android:exported="false"' "$MANIFEST"
          test "$(grep -c 'android:exported="true"' "$MANIFEST")" -eq 1

          DEV_BACKEND=backend/TornFcaDeveloperBackend.gs
          cp "$DEV_BACKEND" /tmp/dev.js
          node --check /tmp/dev.js
          grep -q "const TD_VERSION='1.4.0'" "$DEV_BACKEND"
          grep -q 'TD_SESSION_SECONDS=2\*60\*60' "$DEV_BACKEND"
          grep -q 'bootstrapTornFcaDeveloperRoot' "$DEV_BACKEND"
          grep -q "DEVELOPER_PASSWORD_PEPPER" "$DEV_BACKEND"
          grep -q "DEV_TOTP_" "$DEV_BACKEND"
          grep -q 'tdVerifyTotp_' "$DEV_BACKEND"
          grep -q 'Utilities.MacAlgorithm.HMAC_SHA_1' "$DEV_BACKEND"
          grep -q 'tdFailedLogin_' "$DEV_BACKEND"
          grep -q 'developer_invite_create' "$DEV_BACKEND"
          grep -q 'developer_access_revoke' "$DEV_BACKEND"
          grep -q 'Root Admin cannot be revoked' "$DEV_BACKEND"
          grep -q 'LockService.getScriptLock' "$DEV_BACKEND"

          for file in backend/AccessBackend.gs backend/TornFcaCommunityBackend.gs backend/TornFcaPremiumBackend.gs backend/TornFcaWarPayBackend.gs; do cp "$file" "/tmp/$(basename "$file").js"; node --check "/tmp/$(basename "$file").js"; done
          grep -q "const DF_TOOLKIT_VERSION='1.1.0'" backend/AccessBackend.gs
          grep -q "const TC_VERSION='1.7.0'" backend/TornFcaCommunityBackend.gs
          grep -q "const TORNFCA_PREMIUM_VERSION='1.2.0'" backend/TornFcaPremiumBackend.gs
          grep -q "const TW_VERSION='1.1.0'" backend/TornFcaWarPayBackend.gs

          grep -q "tornGet_('/user/faction',apiKey)" backend/AccessBackend.gs
          grep -q "tcTornGet_('/user/faction',apiKey)" backend/TornFcaCommunityBackend.gs
          grep -q "twTornGet_('/user/faction',apiKey)" backend/TornFcaWarPayBackend.gs
          grep -q 'LockService.getScriptLock' backend/AccessBackend.gs
          grep -q 'LockService.getScriptLock' backend/TornFcaCommunityBackend.gs
          grep -q 'LockService.getScriptLock' backend/TornFcaPremiumBackend.gs
          grep -q 'LockService.getScriptLock' backend/TornFcaWarPayBackend.gs

          COMMUNITY=backend/TornFcaCommunityBackend.gs
          grep -q "const TC_WAR_PREP_CONFIG='WarPrepConfig'" "$COMMUNITY"
          grep -q "const TC_WAR_PREP_STATUS='WarPrepStatus'" "$COMMUNITY"
          grep -q 'app_users_only:true' "$COMMUNITY"
          grep -q 'TC_CHAT_SCAN_LIMIT=5000' "$COMMUNITY"
          grep -q 'TC_CHAT_CHUNK=500' "$COMMUNITY"

          PREMIUM=backend/TornFcaPremiumBackend.gs
          grep -q "setProperty('MONETIZATION_APPROVED','false')" "$PREMIUM"
          grep -q 'if(!premiumMonetizationApproved_())throw new Error' "$PREMIUM"
          RAW_GATES="$(grep -R -l 'PremiumEntitlementStore.hasPremium' app/src/main/java/com/matthayesego/duckforcetoolkit --include='*.java' | grep -v '/PremiumAccess.java$' || true)"
          test -z "$RAW_GATES" || { echo "Raw Premium gate bypass: $RAW_GATES" >&2; exit 1; }

          grep -q 'Faction Announcements' "$UX"
          grep -q 'War Prep Management' "$UX"
          grep -q 'LEGAL_VERSION="2026-08-17-v4"' app/src/main/java/com/matthayesego/duckforcetoolkit/LegalAcceptanceStore.java
          echo 'TornFCA v0.10.4 pre-1.0 source audit passed.'
