name: TornFCA Final Repair Patch v3

on:
  push:
    branches: [ work/v0.10.18-beta-hardening ]
    paths:
      - '.github/workflows/tornfca-final-fix-patch-v3.yml'

permissions:
  contents: write

jobs:
  patch-and-compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening
          fetch-depth: 0

      - name: Record source repair run
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01018-final-source-repair-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/v01018-final-source-repair-run.txt
          if ! git diff --cached --quiet; then git commit -m 'Record final source repair run'; git push origin HEAD:work/v0.10.18-beta-hardening; fi

      - name: Apply source repairs
        shell: python
        run: |
          from pathlib import Path
          def swap(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              if old not in text: raise SystemExit(f'{path}: neither marker found: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          community='backend/TornFcaCommunityBackend.gs'
          swap(community,'TornFCA Community Backend v1.8.1.','TornFCA Community Backend v1.9.0.')
          swap(community,"const TC_VERSION='1.8.1';","const TC_VERSION='1.9.0';")
          swap(community,"    if(action==='chat_send')return tcJson_({ok:true,message:tcSendChat_(key,user,body)});","    if(action==='chat_send')return tcJson_({ok:true,user:tcPublicUser_(user),message:tcSendChat_(key,user,body)});")
          old_send="""function tcSendChat_(apiKey,user,body){
            tcRate_(user.id,'chat_send',2);
            const channel=tcChannel_(user,body.channel),message=String(body.message||'').trim();
            if(!message)throw new Error('Message required.');
            if(message.length>1000)throw new Error('Messages are limited to 1,000 characters.');
            const row={id:Utilities.getUuid(),faction_id:user.faction_id,channel:channel,author_id:user.id,author_name:user.name,message:message,created_at:Math.floor(Date.now()/1000)};
            tcDb_().getSheetByName(TC_CHAT).appendRow([row.id,row.faction_id,row.channel,row.author_id,tcSafe_(row.author_name),tcSafe_(row.message),row.created_at]);
            if(channel!=='leadership')tcPushToFaction_(apiKey,user.faction_id,user.id,'chat',user.name+' • '+channel,message,{channel:channel,author_id:String(user.id)});
            return row;
          }"""
          new_send="""function tcSendChat_(apiKey,user,body){
            tcRate_(user.id,'chat_send',1);
            const expectedFaction=Number(body.faction_id||0);
            if(expectedFaction>0&&expectedFaction!==Number(user.faction_id||0))throw new Error('Your faction changed. Chat moved to your current faction; please send again there.');
            const channel=tcChannel_(user,body.channel),message=String(body.message||'').trim();
            if(!message)throw new Error('Message required.');
            if(message.length>1000)throw new Error('Messages are limited to 1,000 characters.');
            const row={id:Utilities.getUuid(),faction_id:user.faction_id,channel:channel,author_id:user.id,author_name:user.name,message:message,created_at:Math.floor(Date.now()/1000)};
            tcDb_().getSheetByName(TC_CHAT).appendRow([row.id,row.faction_id,row.channel,row.author_id,tcSafe_(row.author_name),tcSafe_(row.message),row.created_at]);
            if(channel!=='leadership'){
              try{tcPushToFaction_(apiKey,user.faction_id,user.id,'chat',user.name+' • '+channel,message,{channel:channel,author_id:String(user.id)});}catch(pushErr){row.push_warning=String(pushErr&&pushErr.message||pushErr);}
            }
            return row;
          }"""
          swap(community,old_send,new_send)

          premium='backend/TornFcaPremiumBackend.gs'
          swap(premium,'global premium entitlement backend v1.3.0.','global premium entitlement backend v1.3.1.')
          swap(premium,"const TORNFCA_PREMIUM_VERSION='1.3.0';","const TORNFCA_PREMIUM_VERSION='1.3.1';")
          swap(premium,"      return premiumJson_({ok:true,entitlement:readEntitlement_(user.id)});","      const config=readPremiumConfig_();\n      return premiumJson_({ok:true,entitlement:readEntitlement_(user.id),offer:{days_per_xanax:config.days_per_xanax,required_message:config.required_message,payment_player_id:TORNFCA_PREMIUM_DEVELOPER_ID,activations_open:premiumMonetizationApproved_()}});")

          ux='app/src/main/java/com/matthayesego/duckforcetoolkit/BetaUxRepair.java'
          swap(ux,'import android.widget.FrameLayout;\n','import android.widget.Button;\nimport android.widget.FrameLayout;\n')
          old='    private static void compactReturnRail(Activity activity,View root){View found=findTag(root,RAIL_TAG);if(!(found instanceof LinearLayout))return;LinearLayout rail=(LinearLayout)found;if(RAIL_COMPACT.equals(String.valueOf(rail.getContentDescription())))return;String section=sectionFor(activity);rail.removeAllViews();rail.setContentDescription(RAIL_COMPACT);rail.setOrientation(LinearLayout.HORIZONTAL);rail.setGravity(Gravity.START|Gravity.CENTER_VERTICAL);rail.setPadding(0,0,0,0);rail.setBackground(null);rail.setElevation(0f);TextView back=TornFcaCommandUi.text(activity,"←  "+section,10.8f,TornFcaCommandUi.MUTED,true);back.setPadding(TornFcaCommandUi.dp(activity,10),TornFcaCommandUi.dp(activity,6),TornFcaCommandUi.dp(activity,10),TornFcaCommandUi.dp(activity,6));back.setBackground(TornFcaCommandUi.solid(activity,Color.argb(95,18,26,39),9,TornFcaCommandUi.LINE_SOFT,1));back.setClickable(true);back.setFocusable(true);back.setForeground(TornFcaCommandUi.ripple(activity,TornFcaCommandUi.GOLD,9));back.setOnClickListener(v->{Intent i=TornFcaCommandRuntime.homeIntent(activity,section);i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);activity.startActivity(i);});rail.addView(back,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,ViewGroup.LayoutParams.WRAP_CONTENT));}\n'
          new='    private static void compactReturnRail(Activity activity,View root){View found=findTag(root,RAIL_TAG);if(!(found instanceof LinearLayout))return;LinearLayout rail=(LinearLayout)found;if(!RAIL_COMPACT.equals(String.valueOf(rail.getContentDescription()))){String section=sectionFor(activity);rail.removeAllViews();rail.setContentDescription(RAIL_COMPACT);rail.setOrientation(LinearLayout.HORIZONTAL);rail.setGravity(Gravity.START|Gravity.CENTER_VERTICAL);rail.setPadding(0,0,0,0);rail.setBackground(null);rail.setElevation(0f);TextView back=TornFcaCommandUi.text(activity,"←  "+section,10.8f,TornFcaCommandUi.MUTED,true);back.setPadding(TornFcaCommandUi.dp(activity,10),TornFcaCommandUi.dp(activity,6),TornFcaCommandUi.dp(activity,10),TornFcaCommandUi.dp(activity,6));back.setBackground(TornFcaCommandUi.solid(activity,Color.argb(95,18,26,39),9,TornFcaCommandUi.LINE_SOFT,1));back.setClickable(true);back.setFocusable(true);back.setForeground(TornFcaCommandUi.ripple(activity,TornFcaCommandUi.GOLD,9));back.setOnClickListener(v->{Intent i=TornFcaCommandRuntime.homeIntent(activity,section);i.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP|Intent.FLAG_ACTIVITY_SINGLE_TOP);activity.startActivity(i);});rail.addView(back,new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,ViewGroup.LayoutParams.WRAP_CONTENT));}removeLegacyHeaderBackButton(rail);}\n    private static void removeLegacyHeaderBackButton(LinearLayout rail){ViewParent parent=rail.getParent();if(!(parent instanceof LinearLayout))return;LinearLayout page=(LinearLayout)parent;for(int i=page.getChildCount()-1;i>=0;i--){View child=page.getChildAt(i);if(child==rail||!(child instanceof Button))continue;CharSequence raw=((Button)child).getText();if(raw!=null&&raw.toString().trim().startsWith("←"))page.removeViewAt(i);}}\n'
          swap(ux,old,new)

          command='app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java'
          old='copy.addView(meta,mp);TextView expand=TornFcaCommandUi.text(this,"⌄",22,TornFcaCommandUi.PURPLE_2,false);'
          new='copy.addView(meta,mp);boolean verifiedPremium=identity.playerId>0&&PremiumEntitlementStore.hasPremium(this,identity.playerId);boolean premium=identity.playerId>0&&PremiumAccess.has(this,identity.playerId,PremiumAccess.PERSONAL_INSIGHTS);String plan=premium?(verifiedPremium?"PREMIUM":"PREMIUM PREVIEW"):"FREE";TextView planView=TornFcaCommandUi.text(this,plan,10.5f,premium?TornFcaCommandUi.GOLD_2:TornFcaCommandUi.BLUE,true);planView.setLetterSpacing(.10f);LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT,ViewGroup.LayoutParams.WRAP_CONTENT);pp.topMargin=TornFcaCommandUi.dp(this,7);copy.addView(planView,pp);TextView expand=TornFcaCommandUi.text(this,"⌄",22,TornFcaCommandUi.PURPLE_2,false);'
          swap(command,old,new)

      - name: Syntax-check Apps Script
        run: |
          set -euo pipefail
          for file in backend/*.gs; do cp "$file" "/tmp/$(basename "$file").js"; node --check "/tmp/$(basename "$file").js"; done
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile repaired beta source
        run: gradle --no-daemon :app:compileBetaJavaWithJavac
      - name: Commit verified source repairs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/TornFcaCommunityBackend.gs backend/TornFcaPremiumBackend.gs app/src/main/java/com/matthayesego/duckforcetoolkit/BetaUxRepair.java app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'Finish chat premium and navigation repairs'
          git pull --rebase origin work/v0.10.18-beta-hardening
          git push origin HEAD:work/v0.10.18-beta-hardening
