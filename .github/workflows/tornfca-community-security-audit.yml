name: TornFCA Community Security Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify community tenant, moderation, War Prep, scale and push safety
        run: |
          set -euo pipefail
          BACKEND=backend/TornFcaCommunityBackend.gs
          CLIENT=app/src/main/java/com/matthayesego/duckforcetoolkit/CommunityBackendClient.java
          CHAT=app/src/main/java/com/matthayesego/duckforcetoolkit/FactionChatActivity.java
          MOD=app/src/main/java/com/matthayesego/duckforcetoolkit/CommunityModerationActivity.java
          MSG=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaMessagingService.java
          WARPREP=app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          WARPREP_ADMIN=app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepLeadershipActivity.java

          grep -q "const TC_VERSION='1.7.0'" "$BACKEND"
          cp "$BACKEND" /tmp/community.js
          node --check /tmp/community.js

          grep -q 'const user=tcVerifyUser_(key);' "$BACKEND"
          grep -q "tcTornGet_('/user/faction',apiKey)" "$BACKEND"
          grep -q "tcTornGet_('/user/basic',apiKey)" "$BACKEND"
          ! grep -q 'freshIdentity' "$BACKEND"
          ! grep -q 'community_identity:' "$BACKEND"

          grep -q 'Number(values\[i\]\[1\])!==user.faction_id' "$BACKEND"
          grep -q 'Message does not belong to your current faction.' "$BACKEND"
          grep -q 'Guide does not belong to your current faction.' "$BACKEND"
          grep -q 'Number(values\[i\]\[1\])!==Number(factionId)' "$BACKEND"

          grep -q 'TC_CHAT_SCAN_LIMIT=5000' "$BACKEND"
          grep -q 'TC_CHAT_CHUNK=500' "$BACKEND"
          grep -q 'function tcFindExactRow_' "$BACKEND"
          grep -q 'function tcFindAllExactRows_' "$BACKEND"
          grep -q 'function tcTailRows_' "$BACKEND"
          awk '/function tcReadChat_/{flag=1} flag{print} flag && /^}/{exit}' "$BACKEND" > /tmp/chat-read.txt
          grep -q 'getRange(start,1,count,7)' /tmp/chat-read.txt
          ! grep -q 'getDataRange' /tmp/chat-read.txt
          awk '/function tcReportChat_/{flag=1} flag{print} flag && /^}/{exit}' "$BACKEND" > /tmp/chat-report.txt
          grep -q 'tcFindExactRow_' /tmp/chat-report.txt
          grep -q 'tcTailRows_' /tmp/chat-report.txt

          grep -q 'LockService.getScriptLock' "$BACKEND"
          grep -q 'function tcReportChat_' "$BACKEND"
          grep -q 'function tcModerationResolve_' "$BACKEND"
          grep -q 'function tcSaveTrainingRules_' "$BACKEND"
          grep -q 'function tcSaveTrainingGuide_' "$BACKEND"
          grep -q 'function tcRegisterDevice_' "$BACKEND"

          grep -q 'TC_MODERATOR_PLAYER_ID=3987363' "$BACKEND"
          grep -q "setProperty('MODERATION_ALLOW_LEADERS','false')" "$BACKEND"
          grep -q "setProperty('MODERATION_ABILITIES','')" "$BACKEND"
          grep -q 'function tcModerationPolicy_' "$BACKEND"
          grep -q 'function tcPositionAbilities_' "$BACKEND"
          grep -q 'function tcCanModerate_' "$BACKEND"
          grep -q 'if(!globalScope&&factionId!==Number(user.faction_id))continue' "$BACKEND"
          grep -q 'Moderation report belongs to another faction.' "$BACKEND"
          grep -q '\[Removed by TornFCA moderation\]' "$BACKEND"

          # War Prep is multi-tenant by verified faction ID and resets completion by ranked-war ID.
          grep -q "const TC_WAR_PREP_CONFIG='WarPrepConfig'" "$BACKEND"
          grep -q "const TC_WAR_PREP_STATUS='WarPrepStatus'" "$BACKEND"
          grep -q "action==='warprep_state'" "$BACKEND"
          grep -q "action==='warprep_status_save'" "$BACKEND"
          grep -q "action==='warprep_leadership'" "$BACKEND"
          grep -q "action==='warprep_config_save'" "$BACKEND"
          grep -q 'user.faction_id,warId,user.id' "$BACKEND"
          grep -q 'app_users_only:true' "$BACKEND"
          grep -q 'warPrepState' "$CLIENT"
          grep -q 'saveWarPrepStatus' "$CLIENT"
          grep -q 'warPrepLeadership' "$CLIENT"
          grep -q 'saveWarPrepConfig' "$CLIENT"
          grep -q 'tornfca_war_prep_v2' "$WARPREP"
          grep -q 'war.warId' "$WARPREP"
          grep -q 'persistChecklistMetadata' "$WARPREP"
          grep -q 'authenticateFreshFaction' "$WARPREP_ADMIN"
          grep -q 'APP USERS THIS WAR' "$WARPREP_ADMIN"

          grep -q 'reportChatMessage' "$CLIENT"
          grep -q 'moderationReports' "$CLIENT"
          grep -q 'resolveModerationReport' "$CLIENT"
          grep -q '"Report"' "$CHAT"
          grep -q '"Block User"' "$CHAT"
          grep -q 'BlockedUserStore.isBlocked' "$MSG"
          grep -q 'Remove Message' "$MOD"
          grep -q 'Dismiss' "$MOD"

          ! grep -q "setProperty(.*apiKey" "$BACKEND"
          ! grep -q "appendRow(.*apiKey" "$BACKEND"

          echo 'TornFCA Community v1.7 security/War Prep/scale audit passed.'
