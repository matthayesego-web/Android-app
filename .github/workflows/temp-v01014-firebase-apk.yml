name: TEMP TornFCA v0.10.14 Firebase APK

on:
  pull_request:
    branches: [ v0.9-faction-automation ]

permissions:
  contents: read

jobs:
  build-firebase-beta:
    runs-on: ubuntu-latest
    env:
      TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
      TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
      TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
      TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout v0.10.14 candidate
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.14-push-infrastructure

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate Firebase inputs
        run: |
          set -euo pipefail
          test -n "$TORNFCA_FIREBASE_APP_ID"
          test -n "$TORNFCA_FIREBASE_API_KEY"
          test -n "$TORNFCA_FIREBASE_PROJECT_ID"
          test -n "$TORNFCA_FIREBASE_SENDER_ID"
          grep -q 'versionName = "0.10.14"' app/build.gradle.kts
          grep -q 'versionCode = 69' app/build.gradle.kts

      - name: Compile Firebase Beta APK
        run: gradle --no-daemon :app:assembleBeta

      - name: Upload unsigned Firebase Beta
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.14-Firebase-unsigned
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7
