name: TornFCA v0.10.19 Android 16 Compatibility Repair

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/workflows/v01019-android16-compat-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply Android 16 and min-SDK compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); t=p.read_text()
              if old not in t:
                  if new in t:
                      return
                  raise SystemExit(f'{label}: expected source pattern not found in {path}')
              p.write_text(t.replace(old,new,1))

          # AndroidX Activity supplies the backward-compatible predictive-back dispatcher.
          p=Path('app/build.gradle.kts'); t=p.read_text()
          dep='    implementation("androidx.activity:activity:1.10.1")\n'
          if dep not in t:
              marker='dependencies {\n'
              if marker not in t: raise SystemExit('dependencies block not found')
              t=t.replace(marker,marker+dep,1)
              p.write_text(t)

          # Root activity: migrate from Activity/onBackPressed to ComponentActivity dispatcher.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java'
          replace_once(path,'import android.app.Activity;\n','import androidx.activity.ComponentActivity;\nimport androidx.activity.OnBackPressedCallback;\n','Companion imports')
          replace_once(path,'public class CompanionActivity extends Activity {','public class CompanionActivity extends ComponentActivity {','Companion base class')
          replace_once(path,
              'super.onCreate(savedInstanceState);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);keyStore=new SecureApiKeyStore(this);\n        String saved=keyStore.load();',
              'super.onCreate(savedInstanceState);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);keyStore=new SecureApiKeyStore(this);\n        getOnBackPressedDispatcher().addCallback(this,new OnBackPressedCallback(true){@Override public void handleOnBackPressed(){if(screen!=Screen.HOME&&screen!=Screen.LOGIN)showHome();else finish();}});\n        String saved=keyStore.load();',
              'Companion dispatcher')
          replace_once(path,
              '    @Override public void onBackPressed(){if(screen!=Screen.HOME&&screen!=Screen.LOGIN)showHome();else super.onBackPressed();}\n',
              '',
              'Companion old back override')

          # Play review sandbox: preserve feature/dashboard/task behavior under predictive back.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/PlayReviewActivity.java'
          replace_once(path,'import android.app.Activity;\n','import androidx.activity.ComponentActivity;\nimport androidx.activity.OnBackPressedCallback;\n','PlayReview imports')
          replace_once(path,'public class PlayReviewActivity extends Activity {','public class PlayReviewActivity extends ComponentActivity {','PlayReview base class')
          replace_once(path,
              '        getWindow().setNavigationBarColor(TornFcaUi.BG);\n        if(PlayReviewStore.isActive(this)){',
              '        getWindow().setNavigationBarColor(TornFcaUi.BG);\n        getOnBackPressedDispatcher().addCallback(this,new OnBackPressedCallback(true){@Override public void handleOnBackPressed(){if(PlayReviewStore.isActive(PlayReviewActivity.this)&&featureOpen)showDashboard();else if(PlayReviewStore.isActive(PlayReviewActivity.this))moveTaskToBack(true);else finish();}});\n        if(PlayReviewStore.isActive(this)){',
              'PlayReview dispatcher')
          old='''    @SuppressWarnings("deprecation")\n    @Override public void onBackPressed(){\n        if(PlayReviewStore.isActive(this)&&featureOpen)showDashboard();else if(PlayReviewStore.isActive(this))moveTaskToBack(true);else super.onBackPressed();\n    }\n'''
          replace_once(path,old,'','PlayReview old back override')

          # Embedded tool: WebView history first, then pop activity.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java'
          replace_once(path,'import android.app.Activity;\n','import androidx.activity.ComponentActivity;\nimport androidx.activity.OnBackPressedCallback;\n','ToolHost imports')
          replace_once(path,'public class ToolHostActivity extends Activity {','public class ToolHostActivity extends ComponentActivity {','ToolHost base class')
          replace_once(path,
              '@Override protected void onCreate(Bundle savedInstanceState){super.onCreate(savedInstanceState);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);keyStore=new SecureApiKeyStore(this);Tool tool;',
              '@Override protected void onCreate(Bundle savedInstanceState){super.onCreate(savedInstanceState);getWindow().setStatusBarColor(BG);getWindow().setNavigationBarColor(BG);keyStore=new SecureApiKeyStore(this);getOnBackPressedDispatcher().addCallback(this,new OnBackPressedCallback(true){@Override public void handleOnBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else finish();}});Tool tool;',
              'ToolHost dispatcher')
          replace_once(path,
              '    @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}\n',
              '',
              'ToolHost old back override')

          # Current shell callback is added after the inherited callback, so it gets first refusal.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java'
          p=Path(path); t=p.read_text()
          if 'import androidx.activity.OnBackPressedCallback;' not in t:
              t=t.replace('import android.widget.TextView;\n','import android.widget.TextView;\n\nimport androidx.activity.OnBackPressedCallback;\n',1)
          old='    @Override protected void onCreate(Bundle savedInstanceState){super.onCreate(savedInstanceState);}\n'
          new='''    @Override protected void onCreate(Bundle savedInstanceState){\n        super.onCreate(savedInstanceState);\n        getOnBackPressedDispatcher().addCallback(this,new OnBackPressedCallback(true){\n            @Override public void handleOnBackPressed(){\n                if(submenuBack!=null){Runnable back=submenuBack;submenuBack=null;back.run();return;}\n                setEnabled(false);\n                getOnBackPressedDispatcher().onBackPressed();\n                setEnabled(true);\n            }\n        });\n    }\n'''
          if old in t:t=t.replace(old,new,1)
          elif new not in t:raise SystemExit('TornFcaCurrent onCreate pattern not found')
          old='''    @SuppressWarnings("deprecation")\n    @Override public void onBackPressed(){\n        if(submenuBack!=null){\n            Runnable back=submenuBack;\n            submenuBack=null;\n            back.run();\n            return;\n        }\n        super.onBackPressed();\n    }\n\n'''
          if old in t:t=t.replace(old,'',1)
          elif 'public void onBackPressed()' in t:raise SystemExit('Unexpected TornFcaCurrent back override form')
          p.write_text(t)

          # NotificationChannel calls are genuinely API 26+ and are reached only after the SDK guard.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/NotificationCenter.java'
          replace_once(path,'import android.Manifest;\n','import android.Manifest;\nimport android.annotation.TargetApi;\n','Notification TargetApi import')
          replace_once(path,
              '    private static void create(NotificationManager m,String id,String name,String description,int importance){NotificationChannel ch=new NotificationChannel(id,name,importance);ch.setDescription(description);m.createNotificationChannel(ch);}',
              '    @TargetApi(26) private static void create(NotificationManager m,String id,String name,String description,int importance){NotificationChannel ch=new NotificationChannel(id,name,importance);ch.setDescription(description);m.createNotificationChannel(ch);}',
              'Notification channel API annotation')

          # Keep all common style attributes available on API 24+, and add light-navigation-bar only on API 27+.
          Path('app/src/main/res/values/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="TornFcaButton" parent="android:style/Widget.Material.Button">\n        <item name="android:fontFamily">sans-serif-medium</item>\n        <item name="android:textAllCaps">false</item>\n        <item name="android:textSize">14sp</item>\n        <item name="android:letterSpacing">0.01</item>\n        <item name="android:minHeight">44dp</item>\n        <item name="android:minWidth">44dp</item>\n    </style>\n\n    <style name="AppThemeBase" parent="android:style/Theme.Material.NoActionBar">\n        <item name="android:fontFamily">sans</item>\n        <item name="android:buttonStyle">@style/TornFcaButton</item>\n        <item name="android:windowActionModeOverlay">true</item>\n        <item name="android:windowNoTitle">true</item>\n        <item name="android:windowBackground">@color/app_bg</item>\n        <item name="android:colorAccent">@color/app_accent</item>\n        <item name="android:navigationBarColor">@color/app_bg</item>\n        <item name="android:statusBarColor">@color/app_bg</item>\n        <item name="android:windowLightStatusBar">false</item>\n    </style>\n    <style name="AppTheme" parent="@style/AppThemeBase" />\n</resources>\n''')
          Path('app/src/main/res/values-v27').mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values-v27/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="@style/AppThemeBase">\n        <item name="android:windowLightNavigationBar">false</item>\n    </style>\n</resources>\n''')
          Path('app/src/beta/res/values/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="@style/AppThemeBase">\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n    </style>\n</resources>\n''')
          Path('app/src/beta/res/values-v27').mkdir(parents=True,exist_ok=True)
          Path('app/src/beta/res/values-v27/styles.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="AppTheme" parent="@style/AppThemeBase">\n        <item name="android:windowDrawsSystemBarBackgrounds">true</item>\n        <item name="android:windowLightNavigationBar">false</item>\n    </style>\n</resources>\n''')

          # Guard two optional navigation-bar UI flags on the API where the constant exists.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/BetaSurfacePolish.java'
          replace_once(path,
              '        flags&=~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;flags&=~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n',
              '        flags&=~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;if(android.os.Build.VERSION.SDK_INT>=26)flags&=~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n',
              'BetaSurfacePolish API guard')
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/CurrentShellVisualHotfix.java'
          replace_once(path,
              '        flags&=~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;\n        flags&=~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n',
              '        flags&=~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;\n        if(android.os.Build.VERSION.SDK_INT>=26)flags&=~View.SYSTEM_UI_FLAG_LIGHT_NAVIGATION_BAR;\n',
              'CurrentShellVisualHotfix API guard')

          # Remove two stale user-visible hardcoded legacy version labels.
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/PolishedCompanionActivity.java'
          replace_once(path,
              '        footer.setText("Duck Force Companion v0.8.0 • faction operating layer");',
              '        footer.setText("TornFCA v"+TornFcaBrand.VERSION+" • faction operating layer");',
              'legacy footer version')
          path='app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumActionPolish.java'
          replace_once(path,
              '            text.setText("TornFCA v0.9.19 preview");\n            raw = "TornFCA v0.9.19 preview";',
              '            String current="TornFCA v"+TornFcaBrand.VERSION+" preview";text.setText(current);\n            raw=current;',
              'premium polish version')
          PY

      - name: Confirm no legacy back overrides remain in affected activities
        run: |
          set -euo pipefail
          for f in CompanionActivity.java PlayReviewActivity.java ToolHostActivity.java TornFcaCurrentActivity.java; do
            ! grep -q 'void onBackPressed' "app/src/main/java/com/matthayesego/duckforcetoolkit/$f"
          done
          grep -q 'OnBackPressedCallback' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionActivity.java
          grep -q 'OnBackPressedCallback' app/src/main/java/com/matthayesego/duckforcetoolkit/PlayReviewActivity.java
          grep -q 'OnBackPressedCallback' app/src/main/java/com/matthayesego/duckforcetoolkit/ToolHostActivity.java
          grep -q 'OnBackPressedCallback' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Compile and lint repaired v0.10.19 before commit
        env:
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleBeta :app:testDebugUnitTest :app:lintBeta

      - name: Commit only after compile, tests and lint pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java app/src/main/res app/src/beta/res
          git commit -m 'Fix Android 16 back navigation and min-SDK compatibility' || true
          git pull --rebase origin develop
          git push origin HEAD:develop
