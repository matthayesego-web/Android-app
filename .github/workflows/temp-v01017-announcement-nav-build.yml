name: TEMP TornFCA v0.10.17 Announcement and Navigation Build

on:
  push:
    branches: [ work/v0.10.17-announcement-nav-fixes ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
      TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
      TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
      TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
    steps:
      - name: Checkout isolated v0.10.17 source
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.17-announcement-nav-fixes
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Apply v0.10.17 navigation and backend source fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if old in text:
                  p.write_text(text.replace(old,new,1)); return
              if new in text: return
              raise SystemExit(f'Missing expected marker in {path}: {old[:120]}')

          # Remove an obsolete callback-removal line from the new transient banner.
          overlay=Path('app/src/main/java/com/matthayesego/duckforcetoolkit/FactionAnnouncementOverlay.java')
          o=overlay.read_text().replace('        if (existing != null) existing.removeCallbacks(null);\n','')
          overlay.write_text(o)

          # Remember all announcement banners already shown on this device so multiple active
          # announcements cannot alternate forever after auto-dismiss.
          cache='app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmCache.java'
          replace_once(cache,
              'String dismissed = context == null ? "" : context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString("dismissed_notice_id", "");',
              'SharedPreferences noticePrefs = context == null ? null : context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);\n        String dismissed = noticePrefs == null ? "" : noticePrefs.getString("dismissed_notice_id", "");\n        String dismissedIds = noticePrefs == null ? "" : noticePrefs.getString("dismissed_notice_ids", "");')
          replace_once(cache,
              'String id = row.optString("id", ""); if (!id.isEmpty() && id.equals(dismissed)) continue;',
              'String id = row.optString("id", ""); if (!id.isEmpty() && id.equals(dismissed)) continue;\n            if (!id.isEmpty() && dismissedIds.contains("|" + id + "|")) continue;')
          replace_once(cache,
              'context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString("dismissed_notice_id", id).apply();\n        FactionAnnouncementOverlay.refreshVisible();',
              'SharedPreferences p = context.getApplicationContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);\n        String raw = p.getString("dismissed_notice_ids", ""), token = "|" + id + "|";\n        if (!raw.contains(token)) raw = token + raw;\n        if (raw.length() > 6000) raw = raw.substring(0, 6000);\n        p.edit().putString("dismissed_notice_id", id).putString("dismissed_notice_ids", raw).apply();\n        FactionAnnouncementOverlay.refreshVisible();')

          # Preserve the currently selected section when late identity/auth refresh rebuilds the shell.
          current='app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java'
          replace_once(current,
              '    private Runnable submenuBack;\n',
              '    private Runnable submenuBack;\n    private boolean currentShellInstalled;\n')
          replace_once(current,
              '    private void installCurrentShell(ViewGroup host){\n        identity=resolveIdentity();',
              '    private void installCurrentShell(ViewGroup host){\n        String requested=currentShellInstalled?currentSection:(getIntent()==null?null:getIntent().getStringExtra(EXTRA_SECTION));\n        identity=resolveIdentity();')
          replace_once(current,
              '        String requested=getIntent()==null?null:getIntent().getStringExtra(EXTRA_SECTION);\n        renderTop(requested);',
              '        currentShellInstalled=true;\n        renderTop(requested);')
          replace_once(current,
              '        addMenu("READY","My War Prep","Use your personal warfare checklist before Ranked War or territory activity.",TornFcaUi.RED,"Open War Prep",()->openActivity(WarPrepActivity.class));\n        addMenu("ALERTS","Notification Inbox"',
              '        addMenu("READY","My War Prep","Use your personal warfare checklist before Ranked War or territory activity.",TornFcaUi.RED,"Open War Prep",()->openActivity(WarPrepActivity.class));\n        addMenu("ANNOUNCEMENTS","Faction Announcements","Read current leadership announcements and important faction messages.",TornFcaUi.GOLD,"Open announcements",this::openAnnouncements);\n        addMenu("ALERTS","Notification Inbox"')
          replace_once(current,
              '        addMenu("OVERVIEW","Faction Overview","Current faction information available to members.",TornFcaUi.GOLD,"Open overview",()->openActivity(MemberFactionActivity.class));',
              '        addMenu("ANNOUNCEMENTS","Faction Announcements","Current leadership announcements stay here until they are deleted.",TornFcaUi.GOLD,"Open announcements",this::openAnnouncements);\n        addMenu("OVERVIEW","Faction Overview","Current faction information available to members.",TornFcaUi.GOLD,"Open overview",()->openActivity(MemberFactionActivity.class));')
          replace_once(current,
              '    private void openActivity(Class<?> target){\n        startActivity(new Intent(this,target));\n    }',
              '    private void openAnnouncements(){\n        if(identity==null)identity=resolveIdentity();\n        Intent i=new Intent(this,WarNoticeActivity.class);\n        i.putExtra(WarNoticeActivity.EXTRA_FACTION_ID,identity.factionId);\n        i.putExtra(WarNoticeActivity.EXTRA_FACTION_NAME,identity.factionName);\n        i.putExtra(WarNoticeActivity.EXTRA_CAN_PUBLISH,identity.leader);\n        startActivity(i);\n    }\n\n    private void openActivity(Class<?> target){\n        startActivity(new Intent(this,target));\n    }')

          # Faction backend v1.1.1: announcements are indefinite by default and authorized
          # leadership can deactivate/delete them for the whole faction.
          backend='backend/AccessBackend.gs'
          replace_once(backend,'TornFCA shared faction backend v1.1.0.','TornFCA shared faction backend v1.1.1.')
          replace_once(backend,"const DF_TOOLKIT_VERSION='1.1.0';","const DF_TOOLKIT_VERSION='1.1.1';")
          replace_once(backend,
              "    if(action==='post_notice'){\n      if(!hasCurrentPermission_(apiKey,user,'Announcement Changes'))throw new Error('Announcement Changes permission (or Leader/Co-leader) required.');\n      return json_({ok:true,notice:createNotice_(user,body)});\n    }",
              "    if(action==='post_notice'){\n      if(!hasCurrentPermission_(apiKey,user,'Announcement Changes'))throw new Error('Announcement Changes permission (or Leader/Co-leader) required.');\n      return json_({ok:true,notice:createNotice_(user,body)});\n    }\n\n    if(action==='delete_notice'){\n      if(!hasCurrentPermission_(apiKey,user,'Announcement Changes'))throw new Error('Announcement Changes permission (or Leader/Co-leader) required.');\n      return json_({ok:true,notice:deleteNotice_(user,body)});\n    }")
          replace_once(backend,
              "  const now=Math.floor(Date.now()/1000);let expiresAt=Number(body.expires_at||0);if(!expiresAt||expiresAt<=now)expiresAt=now+72*3600;",
              "  const now=Math.floor(Date.now()/1000);let expiresAt=Number(body.expires_at||0);if(!Number.isFinite(expiresAt)||expiresAt<=now)expiresAt=0;")
          replace_once(backend,
              'function readActiveNotices_(factionId){',
              "function deleteNotice_(user,body){\n  const id=String(body.notice_id||'').trim();if(!id)throw new Error('Notice ID required.');\n  const sheet=db_().getSheetByName(DF_SHEETS.NOTICES),lock=LockService.getScriptLock();lock.waitLock(10000);\n  try{\n    const values=sheet.getDataRange().getValues();\n    for(let i=1;i<values.length;i++){\n      if(String(values[i][0]||'')!==id||Number(values[i][1]||0)!==Number(user.faction_id))continue;\n      sheet.getRange(i+1,9).setValue(false);\n      return{id:id,faction_id:user.faction_id,active:false};\n    }\n  }finally{lock.releaseLock();}\n  throw new Error('Announcement not found.');\n}\n\nfunction readActiveNotices_(factionId){")
          PY

      - name: Validate v0.10.17 source
        run: |
          set -euo pipefail
          test -n "$TORNFCA_FIREBASE_APP_ID"
          test -n "$TORNFCA_FIREBASE_API_KEY"
          test -n "$TORNFCA_FIREBASE_PROJECT_ID"
          test -n "$TORNFCA_FIREBASE_SENDER_ID"
          grep -q 'versionName = "0.10.17"' app/build.gradle.kts
          grep -q 'versionCode = 72' app/build.gradle.kts
          grep -q 'AUTO_DISMISS_MS = 3200L' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionAnnouncementOverlay.java
          grep -q 'dismissed_notice_ids' app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmCache.java
          grep -q 'currentShellInstalled' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java
          grep -q 'Faction Announcements' app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java
          grep -q "const DF_TOOLKIT_VERSION='1.1.1'" backend/AccessBackend.gs
          grep -q "action==='delete_notice'" backend/AccessBackend.gs
          grep -q 'deleteNotice' app/src/main/java/com/matthayesego/duckforcetoolkit/CompanionBackendClient.java
          cp backend/AccessBackend.gs /tmp/faction-backend.js
          node --check /tmp/faction-backend.js

      - name: Compile Beta
        run: gradle --no-daemon :app:assembleBeta

      - name: Commit validated source patches
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/com/matthayesego/duckforcetoolkit/FactionAnnouncementOverlay.java \
            app/src/main/java/com/matthayesego/duckforcetoolkit/StartupWarmCache.java \
            app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCurrentActivity.java \
            backend/AccessBackend.gs
          if ! git diff --cached --quiet; then
            git commit -m 'Finish v0.10.17 announcement and navigation fixes'
            git push origin HEAD:work/v0.10.17-announcement-nav-fixes
          fi

      - name: Upload unsigned v0.10.17 Beta
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Beta-v0.10.17-Announcement-Nav-unsigned
          path: app/build/outputs/apk/beta/app-beta-unsigned.apk
          if-no-files-found: error
          retention-days: 7
