name: TornFCA Premium Matrix Audit

on:
  push:
    branches: [ work/v0.10.18-beta-hardening ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  premium-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening

      - name: Verify v0.10.18 Free/Premium enforcement matrix
        run: |
          set -euo pipefail

          GRADLE=app/build.gradle.kts
          MANIFEST=app/src/main/AndroidManifest.xml
          ACCESS=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumAccess.java
          STORE=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumEntitlementStore.java
          DEV=app/src/main/java/com/matthayesego/duckforcetoolkit/DeveloperSettings.java
          ROUTER=app/src/main/java/com/matthayesego/duckforcetoolkit/FeatureRouterActivity.java
          INSIGHTS=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumInsightsActivity.java
          TRAINING=app/src/main/java/com/matthayesego/duckforcetoolkit/TrainingProgressActivity.java
          TRENDS=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumActivityTrendsActivity.java
          ALERTS=app/src/main/java/com/matthayesego/duckforcetoolkit/NotificationSettingsActivity.java
          PREVIEW=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumPreviewActivity.java
          ADMIN=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumAdminActivity.java
          CLIENT=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumBackendClient.java
          COMMAND=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          PREMIUM_BACKEND=backend/TornFcaPremiumBackend.gs
          MATRIX=docs/PREMIUM_MATRIX_0.10.1.md
          PLAN=PREMIUM_PLAN.md

          grep -q 'versionName = "0.10.18"' "$GRADLE"
          grep -q 'versionCode = 73' "$GRADLE"

          # Backend-verified entitlement remains the only persisted production Premium state.
          ! grep -q 'simulatePremium' "$STORE"
          grep -q 'public static String tier' "$STORE"
          grep -q 'expirySummary' "$STORE"
          grep -q 'sourceLabel' "$STORE"
          RAW_GATES="$(grep -R -l 'PremiumEntitlementStore.hasPremium' app/src/main/java/com/matthayesego/duckforcetoolkit --include='*.java' | grep -v '/PremiumAccess.java$' || true)"
          if [ -n "$RAW_GATES" ]; then echo 'Direct Premium entitlement feature-gate bypass found:' >&2; echo "$RAW_GATES" >&2; exit 1; fi

          grep -q 'getBoolean(KEY_PREMIUM_SIM, false)' "$DEV"
          ! grep -q 'getBoolean(KEY_PREMIUM_SIM, true)' "$DEV"
          grep -q 'DeveloperSessionStore.Session developer=new DeveloperSessionStore(context).load()' "$ACCESS"
          grep -q 'developer!=null&&DeveloperSettings.simulatePremium(context)' "$ACCESS"
          grep -q 'RemoteFeaturePolicy.featureDisabled(context,"premium")' "$ACCESS"
          grep -q 'RemoteFeaturePolicy.maintenanceMode(context)' "$ACCESS"
          grep -q 'RemoteFeaturePolicy.versionBlocked(context)' "$ACCESS"

          grep -q 'EXTENDED_ACTIVITY="extended_activity"' "$ACCESS"
          grep -q 'FACTION_PULSE="faction_pulse"' "$ACCESS"
          grep -q 'MEMBER_DOSSIER="member_dossier"' "$ACCESS"
          grep -q 'ADVANCED_ALERTS="advanced_alerts"' "$ACCESS"
          grep -q 'PERSONAL_INSIGHTS="personal_insights"' "$ACCESS"
          grep -q 'TRAINING_GOALS="training_goals"' "$ACCESS"

          # Core faction workflows must remain outside the Premium route gate.
          grep -q 'TARGET_PULSE.equals(target))return PremiumAccess.FACTION_PULSE' "$ROUTER"
          grep -q 'TARGET_LOOKUP.equals(target))return PremiumAccess.MEMBER_DOSSIER' "$ROUTER"
          awk '/private String premiumFeature/{flag=1} flag{print} /return null;/{if(flag){exit}}' "$ROUTER" > /tmp/premium-router.txt
          ! grep -q 'TARGET_WAR_PAYOUT' /tmp/premium-router.txt
          ! grep -q 'TARGET_BANKING' /tmp/premium-router.txt
          ! grep -q 'TARGET_ACTIVITY' /tmp/premium-router.txt
          ! grep -q 'TARGET_WAR.equals' /tmp/premium-router.txt
          ! grep -q 'TARGET_CHAIN' /tmp/premium-router.txt
          ! grep -q 'TARGET_OC' /tmp/premium-router.txt
          ! grep -q 'TARGET_STRENGTH' /tmp/premium-router.txt

          # Personal Premium additions are additive to the Free core.
          grep -q 'PremiumAccess.has(this,session.playerId,PremiumAccess.PERSONAL_INSIGHTS)' "$INSIGHTS"
          grep -q '7-DAY PACE' "$INSIGHTS"
          grep -q 'previous 23-day pace' "$INSIGHTS"
          grep -q 'PremiumAccess.has(this,session.playerId,PremiumAccess.TRAINING_GOALS)' "$TRAINING"
          grep -q 'Training Goal Pacing' "$TRAINING"
          grep -q 'Reset progress baseline' "$TRAINING"
          grep -q 'PremiumAccess.has(this,player,PremiumAccess.ADVANCED_ALERTS)' "$ALERTS"

          # Leadership + Premium remain separate checks.
          grep -q 'authenticateFreshFaction' "$TRENDS"
          grep -q '!AccessPolicy.isLeaderPosition(verified.position)' "$TRENDS"
          grep -q 'PremiumAccess.has(this,verified.playerId,PremiumAccess.EXTENDED_ACTIVITY)' "$TRENDS"
          grep -q 'PremiumActivityTrendsActivity' "$MANIFEST"
          grep -q 'android:name=".PremiumActivityTrendsActivity" android:exported="false"' "$MANIFEST"

          # Player-facing Premium state and activation UX must stay discoverable.
          grep -q 'ACCOUNT TIER' "$PREVIEW"
          grep -q 'Refresh Premium Status' "$PREVIEW"
          grep -q 'PremiumEntitlementStore.expirySummary' "$PREVIEW"
          grep -q '1 Xanax = ' "$PREVIEW"
          grep -q 'PremiumBackendClient.paymentPlayerId' "$PREVIEW"
          grep -q 'PremiumBackendClient.requiredMessage' "$PREVIEW"
          grep -q 'PREMIUM PREVIEW' "$PREVIEW"
          grep -q 'String plan=premium?' "$COMMAND"
          grep -q 'PREMIUM PREVIEW' "$COMMAND"

          # Complimentary grants remain backend-admin only.
          grep -q 'Complimentary Premium' "$ADMIN"
          grep -q 'Grant Complimentary Premium' "$ADMIN"
          grep -q 'PremiumBackendClient.grantComplimentary' "$ADMIN"
          grep -q 'days.setText("7")' "$ADMIN"
          grep -q 'grantComplimentary' "$CLIENT"
          grep -q 'request.put("grant_type","complimentary")' "$CLIENT"

          # Premium backend v1.3.1: seven-day launch price, public offer metadata and fail-closed paid scanning.
          grep -q "const TORNFCA_PREMIUM_VERSION='1.3.1'" "$PREMIUM_BACKEND"
          grep -q 'TORNFCA_DEFAULT_DAYS_PER_XANAX=7' "$PREMIUM_BACKEND"
          grep -q 'payment_player_id:TORNFCA_PREMIUM_DEVELOPER_ID' "$PREMIUM_BACKEND"
          grep -q 'activations_open:premiumMonetizationApproved_()' "$PREMIUM_BACKEND"
          grep -q 'required_message:config.required_message' "$PREMIUM_BACKEND"
          grep -q "grantType==='complimentary'?'COMPLIMENTARY_GRANT':'DEVELOPER_GRANT'" "$PREMIUM_BACKEND"
          grep -q "setProperty('MONETIZATION_APPROVED','false')" "$PREMIUM_BACKEND"
          grep -q 'if(!premiumMonetizationApproved_())throw new Error' "$PREMIUM_BACKEND"
          grep -q 'LockService.getScriptLock' "$PREMIUM_BACKEND"
          grep -q "receiptSource='XANAX_LOG_4103:'" "$PREMIUM_BACKEND"
          grep -q 'currentSource===String(source)' "$PREMIUM_BACKEND"
          grep -q 'config.stacking' "$PREMIUM_BACKEND"

          grep -q 'Basic WarPay calculator' "$MATRIX"
          grep -q 'Current Armory Auditor' "$MATRIX"
          grep -q 'Banking' "$MATRIX"
          grep -q 'Training Goal Pacing' "$MATRIX"
          grep -q 'Premium leadership view: 30-day review' "$PLAN"
          grep -q 'A separate faction-wide paid tier is \*\*deferred beyond v1.0\*\*' "$PLAN"

          echo 'TornFCA v0.10.18 Premium matrix audit passed.'
