name: TornFCA Winning Icon Preview

on:
  push:
    branches: [ work/v0.10.18-beta-hardening ]
    paths:
      - '.github/workflows/tornfca-icon-winner-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current beta source
        uses: actions/checkout@v6
        with:
          ref: work/v0.10.18-beta-hardening

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Use fresh winner preview package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/build.gradle.kts')
          t=p.read_text()
          t=t.replace('applicationIdSuffix = ".internal"','applicationIdSuffix = ".iconwinner"',1)
          t=t.replace('manifestPlaceholders["appLabel"] = "TornFCA Internal"','manifestPlaceholders["appLabel"] = "TornFCA Icon Winner"',1)
          p.write_text(t)
          PY

      - name: Build installable winner preview
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify exact winning icon and APK identity
        run: |
          set -euo pipefail
          ICON='app/build/generated/tornfcaIconRes/drawable-nodpi/tornfca_launcher_final.webp'
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$ICON"
          test -f "$APK"
          echo '78c2a43859fe6fa72818318373b1c3733a404be38e9c0e03aa37b1973a72042e  '"$ICON" | sha256sum -c -
          test "$(stat -c%s "$ICON")" = '22878'
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit.iconwinner'" apk-badging.txt
          grep -q "versionCode='73'" apk-badging.txt
          grep -q "versionName='0.10.18-internal'" apk-badging.txt
          grep -q "application-label:'TornFCA Icon Winner'" apk-badging.txt
          cp "$APK" TornFCA-v0.10.18-WINNING-ICON-PREVIEW.apk
          sha256sum TornFCA-v0.10.18-WINNING-ICON-PREVIEW.apk | tee apk-sha256.txt

      - name: Upload winning icon preview
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v0.10.18-WINNING-ICON-PREVIEW
          path: |
            TornFCA-v0.10.18-WINNING-ICON-PREVIEW.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 7
