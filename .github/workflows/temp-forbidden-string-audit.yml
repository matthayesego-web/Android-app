name: Temporary TornFCA Forbidden String Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Trace legacy Activity references and restriction
        run: |
          echo 'References to ToolkitActivity/MainActivity outside their own files:'
          grep -R -n -E 'ToolkitActivity|MainActivity' app/src/main/java \
            --exclude=ToolkitActivity.java --exclude=MainActivity.java || true
          echo 'Remaining exact Duck Force-only restriction:'
          if grep -R -n -F 'This build is restricted to Duck Force members.' app/src/main; then
            exit 1
          fi
          echo 'No exact legacy restriction found in app/src/main.'
