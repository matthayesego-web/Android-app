name: TornFCA Legacy Restriction Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject obsolete single-faction restrictions
        run: |
          bad=0
          for needle in \
            'This build is restricted to Duck Force members.' \
            'production sign-in gate remains Duck Force-only' \
            'This preview is restricted to Duck Force.'; do
            if grep -R -n -F "$needle" app/src/main; then
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo 'Obsolete single-faction restriction messaging must not be compiled into TornFCA.'
            exit 1
          fi
          echo 'No obsolete Duck Force-only authentication/preview restriction found.'
