name: TornFCA Legacy Restriction Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject legacy single-faction restriction
        run: |
          if grep -R -n -F 'This build is restricted to Duck Force members.' app/src/main; then
            echo 'Legacy single-faction restriction must not be compiled into TornFCA.'
            exit 1
          fi
          echo 'No legacy Duck Force-only authentication restriction found.'
