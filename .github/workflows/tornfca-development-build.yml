name: TornFCA Development APK

on:
  pull_request:
    branches: [ development ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  development-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed development source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read version
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Development branch identity preflight
        run: |
          set -euo pipefail
          test -s PROJECT_STATE.md
          grep -q 'main.*Google Play' PROJECT_STATE.md
          grep -q 'manifestPlaceholders\["appIcon"\] = "@mipmap/ic_launcher_development"' app/build.gradle.kts
          grep -q 'TornFCA Development' app/build.gradle.kts
          grep -q 'RealTornChatActivity' app/src/main/AndroidManifest.xml
          test -s app/src/main/res/drawable/tornfca_development_launcher.xml
          test -s app/src/main/res/mipmap-anydpi/ic_launcher_development.xml
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher_development.xml

      - name: Corrective chat and premium preflight
        run: |
          set -euo pipefail
          UI=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaUi.java
          REAL=app/src/main/java/com/matthayesego/duckforcetoolkit/RealTornChatActivity.java
          ADMIN=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumAdminActivity.java
          CLIENT=app/src/main/java/com/matthayesego/duckforcetoolkit/PremiumBackendClient.java
          PREMIUM=backend/TornFcaPremiumBackend.gs

          ! grep -q 'Button chat=button(a,"Chat"' "$UI"
          grep -q 'a instanceof FactionChatActivity' "$UI"
          grep -q 'Google/Apple OAuth cannot run inside Android WebView' "$REAL"
          grep -q 'API key cannot create a website login' "$REAL"
          ! grep -q 'Developer password' "$ADMIN"
          ! grep -q 'admin_password' "$CLIENT"
          grep -q "const TORNFCA_PREMIUM_VERSION='1.4.0'" "$PREMIUM"
          ! grep -q 'requirePremiumAdmin_' "$PREMIUM"
          cp "$PREMIUM" /tmp/TornFcaPremiumBackend.js
          node --check /tmp/TornFcaPremiumBackend.js

      - name: Navigation architecture preflight
        run: |
          set -euo pipefail
          NAV=app/src/main/java/com/matthayesego/duckforcetoolkit/BetaCommandActivity.java
          RUNTIME=app/src/main/java/com/matthayesego/duckforcetoolkit/TornFcaCommandRuntime.java
          MANIFEST=app/src/main/AndroidManifest.xml

          # The runtime must actually launch the shell being audited.
          grep -q 'new Intent(context, BetaCommandActivity.class)' "$RUNTIME"

          # Canonical bottom navigation.
          grep -q 'navItem("Home"' "$NAV"
          grep -q 'navItem("Faction"' "$NAV"
          grep -q 'navItem("War"' "$NAV"
          grep -q 'navItem("Leadership"' "$NAV"
          grep -q 'navItem("More"' "$NAV"
          ! grep -q 'navItem("Members"' "$NAV"
          ! grep -q 'navItem("Training"' "$NAV"
          ! grep -q 'navItem("Operations"' "$NAV"

          # Leadership hierarchy and newly added features must live in the visible command shell.
          grep -q '"People & Activity"' "$NAV"
          grep -q '"War & Intel"' "$NAV"
          grep -q '"Finance & Assets"' "$NAV"
          grep -q '"Faction Admin"' "$NAV"
          grep -q 'SpyIntelActivity.class' "$NAV"
          grep -q 'CacheMarketAdvisorActivity.class' "$NAV"
          grep -q 'FeedbackActivity.class' "$NAV"
          grep -q 'CommunityModerationActivity.class' "$NAV"
          grep -q 'FactionChatActivity.class' "$NAV"
          grep -q 'SpyIntelActivity' "$MANIFEST"
          grep -q 'CacheMarketAdvisorActivity' "$MANIFEST"

      - name: Compile Development APK
        env:
          TORNFCA_FACTION_BACKEND_URL: ${{ secrets.TORNFCA_FACTION_BACKEND_URL }}
          TORNFCA_COMMUNITY_BACKEND_URL: ${{ secrets.TORNFCA_COMMUNITY_BACKEND_URL }}
          TORNFCA_PREMIUM_BACKEND_URL: ${{ secrets.TORNFCA_PREMIUM_BACKEND_URL }}
          TORNFCA_DEVELOPER_BACKEND_URL: ${{ secrets.TORNFCA_DEVELOPER_BACKEND_URL }}
          TORNFCA_WARPAY_BACKEND_URL: ${{ secrets.TORNFCA_WARPAY_BACKEND_URL }}
          TORNFCA_FEEDBACK_BACKEND_URL: ${{ secrets.TORNFCA_FEEDBACK_BACKEND_URL }}
          TORNFCA_FIREBASE_APP_ID: ${{ secrets.TORNFCA_FIREBASE_APP_ID }}
          TORNFCA_FIREBASE_API_KEY: ${{ secrets.TORNFCA_FIREBASE_API_KEY }}
          TORNFCA_FIREBASE_PROJECT_ID: ${{ secrets.TORNFCA_FIREBASE_PROJECT_ID }}
          TORNFCA_FIREBASE_SENDER_ID: ${{ secrets.TORNFCA_FIREBASE_SENDER_ID }}
        run: gradle --no-daemon :app:assembleBeta

      - name: Sign and verify Development APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do test -n "${!v:-}" || { echo "Missing signing secret: $v"; exit 1; }; done
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APK_SIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          INPUT="app/build/outputs/apk/beta/app-beta-unsigned.apk"
          test -f "$INPUT"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tornfca-release.jks"
          chmod 600 "$RUNNER_TEMP/tornfca-release.jks"
          ALIGNED="$RUNNER_TEMP/TornFCA-Development-v${VERSION_NAME}-aligned.apk"
          OUT="TornFCA-Development-v${VERSION_NAME}.apk"
          "$ZIPALIGN" -P 16 -f 4 "$INPUT" "$ALIGNED"
          "$APK_SIGNER" sign --ks "$RUNNER_TEMP/tornfca-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT" "$ALIGNED"
          "$APK_SIGNER" verify --verbose --print-certs "$OUT" | tee signer-verification.txt
          grep -qi 'c3ecc35a64f8e7ecedda1ca46d5fe0841b890eed9c78ccb6716d61a9237f0322' signer-verification.txt
          "$AAPT" dump badging "$OUT" | tee apk-badging.txt
          grep -q "package: name='com.matthayesego.duckforcetoolkit.beta'" apk-badging.txt
          grep -q "versionCode='${VERSION_CODE}'" apk-badging.txt
          grep -q "versionName='${VERSION_NAME}-development'" apk-badging.txt
          grep -q "application-label:'TornFCA Development'" apk-badging.txt
          sha256sum "$OUT" | tee apk-sha256.txt

      - name: Upload signed Development APK
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-Development-v${{ env.VERSION_NAME }}
          path: |
            TornFCA-Development-v${{ env.VERSION_NAME }}.apk
            apk-badging.txt
            signer-verification.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
