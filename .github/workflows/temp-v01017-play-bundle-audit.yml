name: TEMP TornFCA v0.10.17 Play Bundle Audit

on:
  push:
    branches: [ work/v0.10.17-announcement-nav-fixes ]

permissions:
  contents: write

jobs:
  play-bundle-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: work/v0.10.17-announcement-nav-fixes
          fetch-depth: 0
      - name: Record Play bundle audit run
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '%s\n' "$GITHUB_RUN_ID" > docs/v01017-last-play-bundle-run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v01017-last-play-bundle-run.txt
          git commit -m 'Record v0.10.17 Play bundle audit run'
          git push origin HEAD:work/v0.10.17-announcement-nav-fixes
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Validate Play package metadata
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.matthayesego.duckforcetoolkit"' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionCode = 72' app/build.gradle.kts
          grep -q 'versionName = "0.10.17"' app/build.gradle.kts
          grep -q 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
      - name: Build unsigned normal-package release bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Upload unsigned Play bundle audit artifact
        uses: actions/upload-artifact@v7
        with:
          name: TornFCA-v0.10.17-normal-package-UNSIGNED-Play-AAB-AUDIT
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
