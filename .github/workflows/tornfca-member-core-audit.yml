name: TornFCA Member Core Audit

on:
  push:
    branches: [ v0.9-faction-automation ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Verify free member core, navigation and tenant boundaries
        run: |
          set -euo pipefail

          MEMBER=app/src/main/java/com/matthayesego/duckforcetoolkit/MemberCenterActivity.java
          MANIFEST=app/src/main/AndroidManifest.xml

          # The Member Center must keep the expanded free core discoverable and organized by task.
          grep -q '"My Day"' "$MEMBER"
          grep -q '"Faction Directory"' "$MEMBER"
          grep -q '"Faction Resources"' "$MEMBER"
          grep -q '"Training Center"' "$MEMBER"
          grep -q '"My Training Progress"' "$MEMBER"
          grep -q '"My War Prep"' "$MEMBER"
          grep -q '"Start here"' "$MEMBER"
          grep -q '"Daily & readiness"' "$MEMBER"
          grep -q '"Growth & training"' "$MEMBER"
          grep -q '"My faction"' "$MEMBER"
          grep -q '"Community & alerts"' "$MEMBER"
          grep -q '"Optional upgrade"' "$MEMBER"
          grep -q 'Core faction-member tools stay free' "$MEMBER"
          grep -q 'The core member tools above remain free' "$MEMBER"

          # New member activities and legal screens must remain internal to the app.
          grep -q 'MemberDirectoryActivity" android:exported="false"' "$MANIFEST"
          grep -q 'FactionResourcesActivity" android:exported="false"' "$MANIFEST"
          grep -q 'TrainingCenterActivity" android:exported="false"' "$MANIFEST"
          grep -q 'TrainingProgressActivity" android:exported="false"' "$MANIFEST"
          grep -q 'WarPrepActivity" android:exported="false"' "$MANIFEST"
          grep -q 'LegalActivity" android:exported="false"' "$MANIFEST"
          grep -q 'LegalDocumentActivity" android:exported="false"' "$MANIFEST"

          # The current legal version must gate first launch before Torn sign-in and remain reviewable later.
          grep -q 'LegalAcceptanceStore.hasAcceptedCurrent(this)' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q 'EXTRA_REQUIRE_ACCEPTANCE,true' app/src/main/java/com/matthayesego/duckforcetoolkit/AccessGateActivity.java
          grep -q 'LEGAL_VERSION="2026-08-17-v1"' app/src/main/java/com/matthayesego/duckforcetoolkit/LegalAcceptanceStore.java
          grep -q 'I have reviewed the Privacy Policy, agree to the Terms & Conditions, and agree to the EULA.' app/src/main/java/com/matthayesego/duckforcetoolkit/LegalActivity.java
          grep -q 'Privacy, Terms & EULA' app/src/main/java/com/matthayesego/duckforcetoolkit/AboutActivity.java
          grep -q 'Review Legal Documents' app/src/main/java/com/matthayesego/duckforcetoolkit/SettingsActivity.java
          grep -q 'Legal & Privacy' app/src/main/java/com/matthayesego/duckforcetoolkit/MoreActivity.java

          # Personal training progress is own-player data and its baseline is player+faction scoped.
          grep -q '/user/battlestats' app/src/main/java/com/matthayesego/duckforcetoolkit/TrainingProgressActivity.java
          grep -q '/user/personalstats?cat=drugs' app/src/main/java/com/matthayesego/duckforcetoolkit/TrainingProgressActivity.java
          grep -q '"p"+session.playerId+"_f"+session.factionId+"_"' app/src/main/java/com/matthayesego/duckforcetoolkit/TrainingProgressActivity.java
          grep -q 'Your baseline stays on this device' app/src/main/java/com/matthayesego/duckforcetoolkit/TrainingProgressActivity.java

          # Onboarding/resources are player+faction local and shared guides use the verified faction backend.
          grep -q '"p"+session.playerId+"_f"+session.factionId+"_"' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionResourcesActivity.java
          grep -q 'CommunityBackendClient.trainingLibrary' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionResourcesActivity.java
          grep -q 'Resources belong to the faction' app/src/main/java/com/matthayesego/duckforcetoolkit/FactionResourcesActivity.java

          # War prep is own-player data and checklist state must be isolated by player+faction+war cycle.
          grep -q 'selections=bars,cooldowns,travel,refills,organizedcrime' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          grep -q '"p"+session.playerId+"_f"+session.factionId+"_"+cycle()+"_"' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          grep -q 'No universal war requirements invented' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java
          grep -q 'Faction Resources' app/src/main/java/com/matthayesego/duckforcetoolkit/WarPrepActivity.java

          # Shared training writes remain server-side faction/leadership gated.
          grep -q "action.indexOf('training_')===0" backend/TornFcaCommunityBackend.gs
          grep -q 'tcVerifyUser_(key,freshIdentity)' backend/TornFcaCommunityBackend.gs
          grep -q 'Guide does not belong to your current faction.' backend/TornFcaCommunityBackend.gs
          grep -q 'Faction Leader or Co-leader access is required to change training rules.' backend/TornFcaCommunityBackend.gs

          echo 'TornFCA free member-core/navigation/legal audit passed.'
