name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Read app version
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME" || (echo "Unable to read versionName" && exit 1)
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Name APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "DuckForce-Companion-v${VERSION_NAME}-internal-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "DuckForce-Companion-v${VERSION_NAME}-unsigned-release.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Companion-v${{ env.VERSION_NAME }}-internal-builds
          path: |
            DuckForce-Companion-v${{ env.VERSION_NAME }}-internal-debug.apk
            DuckForce-Companion-v${{ env.VERSION_NAME }}-unsigned-release.apk
          if-no-files-found: error
          retention-days: 14
