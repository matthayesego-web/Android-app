name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DuckForce-Torn-Toolkit-v0.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Torn-Toolkit-v0.1.1
          path: DuckForce-Torn-Toolkit-v0.1.1.apk
          if-no-files-found: error
          retention-days: 30
