name: Build v0.4.1 Polish

on:
  push:
    branches:
      - agent/v041-professional-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Stamp v0.4.1 release version
        run: |
          sed -i 's/versionCode = 5/versionCode = 6/' app/build.gradle.kts
          sed -i 's/versionName = "0.4.0"/versionName = "0.4.1"/' app/build.gradle.kts
      - name: Build debug and unsigned release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Name APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DuckForce-Companion-v0.4.1-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk DuckForce-Companion-v0.4.1-unsigned-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: DuckForce-Companion-v0.4.1
          path: |
            DuckForce-Companion-v0.4.1-debug.apk
            DuckForce-Companion-v0.4.1-unsigned-release.apk
          if-no-files-found: error
          retention-days: 30
